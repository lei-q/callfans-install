                ["Content Recognition Keywords", "Only comment on posts containing specific keywords"]

            { type: "table", headers: ["Parameter", "Description"],
              rows: [

                ["Comment Recognition Keywords", "Short keywords like \"where to buy\", \"link please\" — reply only when matched"],
                ["Reply Content After Recognition", "Reply scripts posted after successful match; can be multiple, randomly selected"],
                ["Execution Window / Count", "Controls interaction frequency and distribution"],

            { type: "p", text: "<strong>What it does:</strong> Send DMs to target users in batch. Supports message templates + variable substitution (e.g., auto-filling the recipient's username). Can integrate with intent user identification results for automated sending." },
            { type: "p", text: "<strong>Supported platforms:</strong> TikTok ✓ Xiaohongshu (RED) ✓ Other platforms adapted on demand." },

            { type: "table", headers: ["Parameter", "Description"],

            { type: "h2", text: "🎬 Livestream" },

                ["AI Model Toggle", "When enabled, AI auto-generates search keywords and filters/screens content", "Improve warming content relevance and diversity"]
              ]
            },
            { type: "tip", text: "<strong>Beginner's advice:</strong> Use default warming parameters — duration 900s, likes 5–35, bookmarks 5–20, search 50–80. CES threshold and content funnel are advanced features — run for a week before enabling." },

            { type: "p", text: "All <strong>numeric-type parameters</strong> across all task capabilities — duration, probability, count, interval, etc. — support <strong>three input modes</strong> to handle randomness requirements when tasks run repeatedly." },

              rows: [
                ["<strong>Fixed Value</strong>", "Enter a specific number, e.g., <code>900</code>", "Same value every execution", "When precision control is needed — e.g., post count, DM count"],
                ["<strong>Range</strong>", "Two numbers connected by \"–\", e.g., <code>600–1200</code>", "Random value within range each execution", "<strong>Most commonly used.</strong> Simulates human behavior variance — different warming duration each time"],
                ["<strong>Incremental</strong>", "Start+step→cap, e.g., <code>100+50→500</code>", "First run uses start value, increments each subsequent run, resets at cap", "Simulates account growth — warming duration increases day by day"]
              ]
            },

            { type: "p", text: "Click to instantly activate established-but-not-yet-effective associations. After activation, the relevant accounts can be recognized and used in the Operator Console's Screen Mirroring Matrix." },

            { type: "p", text: "When an account gets flagged or a proxy expires, you need to query the <strong>impact scope</strong> of the problematic account or proxy — select that account or proxy and click \"Reverse Query\"; the page auto-filters to show the other two associated assets, quickly locating affected devices and accounts." },
            { type: "h3", text: "⑦ User Assignment" },
            { type: "p", text: "After configuring new association relationships, when you need to assign accounts, proxies, and devices to specific users — select the target association item, click \"User Assignment\", search and select the target user to complete the assignment. After assignment, the user can see these assets upon logging into the platform." },
            { type: "h3", text: "⑧ Proxy Sharing Count" },
            { type: "p", text: "The <strong>number indicator</strong> after a network proxy shows how many devices share that proxy. E.g., \"3\" means the proxy is used by three devices simultaneously. High sharing counts may affect network speed — monitor this value and allocate reasonably." }
          ]
        },
        {
          id: "admin-assets",
          title: "Asset Management",
          blocks: [
            { type: "h1", text: "Asset Management" },
            { type: "p", text: "The batch input and unified management center for three core asset types. <strong>This is the recommended method for asset input — batch import, unified management, assignable to different operator accounts as needed.</strong>" },
            { type: "tip", text: "<strong>When to use Operator Console for input?</strong> Only two exceptions: ① Micro-setup (5 devices) with few assets, no batch management needed; ② Operator temporary testing/debugging,不想 bother the admin. Otherwise, <strong>always use the Admin Console</strong>." },
            { type: "h2", text: "Account Pool" },
            { type: "p", text: "The batch input and unified management center for social media accounts. The Operator Console's Account Management can only use already-assigned accounts; <strong>all input and permission assignment is done here</strong>." },
            { type: "ul", items: [
              "<strong>Batch Import:</strong> Download template → fill in account info per format → batch import. Supports unified warehousing of accounts from multiple social platforms. Recommend saving the import template locally as a dual backup.",
              "<strong>Assign Accounts to Users:</strong> Admins can assign accounts to different operators as needed — unassigned accounts are invisible to operators. On the \"Social Account Management\" page: select platform → check accounts → assign to target user.",
              "<strong>Account Grouping & Organization:</strong> Unified group management of accounts here, complementary to the Operator Console's grouping operations."

            { type: "image", src: "http://47.87.66.98:3000/images/asset-account-pool.png", caption: "Fig: Account Pool — social account batch input and management", alt: "Account pool interface" },
            { type: "h2", text: "Proxy Pool" },
            { type: "p", text: "The batch input and unified management center for network proxies. The Operator Console's Network Config can only view and test already-assigned proxies; <strong>all management operations are done here</strong>." },
            { type: "ul", items: [
              "<strong>Batch Import:</strong> Input proxy types including SOCKS5, VMess, HTTP; build an assignable network resource pool. Supports batch proxy connectivity and latency testing.",
              "<strong>Assign Proxies to Users:</strong> Admins can choose whether to expose proxy information to specified users. If not exposed, the user won't see proxy details on the Network Config page, but device networking still works normally — this is permission control and doesn't affect actual usage.",
              "<strong>Provider Management:</strong> Group by proxy provider or IP region for management. When failures occur, can quickly determine if it's a single IP issue or a provider-wide outage."
            ]},
            { type: "image", src: "http://47.87.66.98:3000/images/asset-proxy-pool.png", caption: "Fig: Proxy Pool — network proxy batch input and management", alt: "Proxy pool interface" },
            { type: "h2", text: "Container Pool" },
            { type: "p", text: "Batch management and advanced operations for cloud phone containers. The Operator Console's Phone Management page can only view and group; <strong>all sensitive operations are done here</strong>." },
            { type: "image", src: "http://47.87.66.98:3000/images/asset-container-pool.png", caption: "Fig: Container Pool — cloud phone device batch management", alt: "Container pool interface" },
            { type: "h3", text: "Device Reset & One-Click Device Refresh" },
            { type: "p", text: "When a social account is flagged by platform security (persistent single/double-digit view counts, verification/warning received), or when switching to a new account, these two operations are needed. They represent <strong>different degrees of device cleanup</strong>:" },
            { type: "table", headers: ["Operation", "Degree", "What It Does", "When to Use"],
              rows: [
                ["<strong>Device Reset</strong>", "Full wipe", "Cloud phone restored to factory state — all apps, data, account info completely cleared, back to initial state", "Thoroughly clean the device, preparing for a completely new account"],
                ["<strong>One-Click Refresh</strong>", "Parameter refresh", "Refreshes device parameters that social platforms read — IMEI, sensors, screen params, battery behavior, etc. Does NOT delete installed apps", "Necessary step before logging in a new social account; ensures the platform sees a \"brand new phone\""]
              ]
            },
            { type: "p", text: "<strong>When using One-Click Refresh, select:</strong> target brand, model, carrier. The system generates corresponding device parameters based on your selection." },
            { type: "p", text: "<strong>Standard workflow (should be followed every time you switch accounts):</strong>" },
            { type: "ol", items: [
              "<strong>Unbind first:</strong> In Association Center, unbind existing social accounts from the container (must unbind before device reset)",
              "<strong>Device Reset:</strong> Restore container to factory state",
              "<strong>One-Click Refresh:</strong> Select brand/model/carrier, refresh all device parameters",
              "<strong>Login new account:</strong> On the \"brand new\" container, log in the new social account"
            ]},
            { type: "warn", text: "<strong>Note:</strong> Reset and One-Click Refresh are high-risk operations. After reset, all data is irrecoverable. After refresh, all device parameters change and network proxy must be re-bound. After logging a new account on a device, <strong>do not switch devices within 3 days</strong> — high probability of triggering platform security." },
            { type: "p", text: "<strong>Batch Import:</strong> When scaling up, batch register new container devices." }
          ]
        },

            { type: "p", text: "Global group management — create, edit, delete groups. View device count and account count under a specific group in one place. The Operator Console can create and use groups, but <strong>deletion can only be done in the Admin Console</strong>." },

            { type: "image", src: "http://47.87.66.98:3000/images/system-assign-account-to-user.png", caption: "Fig: Assign social accounts to system users", alt: "Assign accounts to users" },

    {
      name: "Pitfall Guide",
      sections: [
        {
          id: "pitfall-assets",
          title: "Where Assets Come From",
          summary: "80% of matrix operations problems originate at the source — flagged accounts, unclean IPs, mismatched device parameters. Better to screen before warehousing than troubleshoot after.",
          blocks: [
            { type: "h1", text: "Where Assets Come From" },
            { type: "p", text: "The pitfalls of matrix operations <strong>mostly aren't at the operational level</strong> — features are used correctly, parameters are set right, but accounts still get shadowbanned and proxies still get flagged. The root cause is often at the source: the assets themselves have problems, and by the time they enter the pool, it's too late." },
            { type: "h2", text: "Social Media Accounts" },
            { type: "p", text: "Social platforms record each account's <strong>registration device fingerprint, registration IP, and historical behavior trajectory</strong>. What an account experienced before reaching you directly determines how far it can go." },
            { type: "table", headers: ["Problem", "Why It's a Hidden Danger"],
              rows: [
                ["Accounts batch-registered — same device fingerprint registered hundreds of accounts", "Flagged as associated by the platform upon entering the pool — one dies, all die. The platform doesn't need to catch you violating rules — the same fingerprint registering hundreds of accounts is itself a violation signal"],
                ["Second-hand accounts with historical violation records", "Accounts appear normal but have already been silently de-weighted by the platform — post views persistently in single/double digits no matter how you operate"],
                ["Incomplete account info (missing birthday, missing 2FA, missing binding info)", "Cannot appeal when platform security verification is triggered — the account is directly报废. Accounts with complete info can appeal and recover from verification; those with incomplete info hit a dead end upon verification"]
              ]
            },
            { type: "tip", text: "<strong>If you source accounts yourself:</strong> First test a small batch on the platform for a week — confirm survival rate and normal traffic before batch import. One劣质 account entering the pool not only wastes itself but also drags down other accounts sharing the same proxy." },
            { type: "h2", text: "Network Proxies" },
            { type: "p", text: "Proxy IP is the <strong>first line of defense</strong> in matrix operations. When a social platform judges whether an account is suspicious, the first thing it checks is IP type and cleanliness." },
            { type: "table", headers: ["Problem", "Why It's a Hidden Danger"],
              rows: [
                ["Buying data center IPs — cheap, provider claims \"clean\"", "Social platform IP databases directly flag data center ranges as high-risk. Accounts logging in with data center IPs are placed under a microscope from day one"],
                ["Proxy shared by many — you don't know who else is on the same IP doing what", "Dozens of different customers' different behaviors running on the same IP; the platform flags it as an anomalous traffic node — your normal operations get guilt-by-association"]
              ]
            },
            { type: "warn", text: "<strong>⚠️ If you source proxies yourself:</strong> Must confirm they are static residential IPs (not data center, not broadcast, not shared public proxy). Test cleanliness one by one before entering the pool. Poor proxy quality is the #1 cause of batch bans — it's not an operations problem, it's the network being unclean." },
            { type: "h2", text: "Container Devices" },
            { type: "p", text: "Platforms read device IMEI, sensor data, screen parameters, battery behavior, carrier info, etc. to determine if it's a \"real phone.\" The authenticity and independence of parameters determine whether your accounts are flagged as simulated environments." },
            { type: "table", headers: ["Problem", "Why It's a Hidden Danger"],
              rows: [
                ["Using emulators or low-quality cloud phones — device parameters fixed,大量重复", "Platform identifies \"clone machines\" with identical parameters under the same device model; batch-flagged as simulated environments"],
                ["Device parameter mismatch — IMEI format errors, missing sensor data, brand-carrier mismatch", "App reads device info and finds anomalies; directly flagged as suspicious device. This is a basic mistake, but very common"],
                ["Container resource不足 — CPU/memory grabbed by neighboring containers", "App运行卡顿, operations timeout, tasks fail mid-execution — not a strategy problem, it's底层算力不稳定"]
              ]
            },
            { type: "tip", text: "<strong>In one sentence:</strong> Accounts, proxies, containers — if any one of the three is劣质, the matrix won't run stably. Rather than spending time troubleshooting \"why all my accounts died\", screen asset quality before warehousing. The platform can provide vetted accounts, proxies, and devices — contact your representative if interested." }
          ]
        },
        {
          id: "pitfall-risk",
          title: "What Operations Are Likely to Get Flagged",
          summary: "The platform already has extensive anti-detection protections at the system level, but some operations still need your cooperation — understanding these boundaries keeps accounts alive longer.",
          blocks: [
            { type: "h1", text: "What Operations Are Likely to Get Flagged by Platform Security" },
            { type: "p", text: "The platform's task capabilities are designed with built-in <strong>randomization mechanisms</strong> — execution times are randomly distributed within windows, parameter values are randomly picked from ranges, operation intervals simulate human rhythm. But these protections aren't a silver bullet — the following operations still require your understanding and cooperation even with system protections." },
            { type: "h2", text: "What the Platform Already Does for You" },
            { type: "p", text: "Before understanding what NOT to do, know what the system already handles for you — these you don't need to worry about:" },
            { type: "ul", items: [
              "<strong>Behavior randomization:</strong> All numeric parameters support range and incremental modes; each execution picks a random value within range — no scenario where 50 accounts all warm exactly 900 seconds.",
              "<strong>Natural time distribution:</strong> Tasks within execution windows are auto-shuffled with random intervals — no scenario where 50 accounts all start browsing at the same second.",
              "<strong>Operation interval simulation:</strong> Browse dwell time, swipe speed, click intervals — all distributed according to human behavior models, not fixed delays.",
              "<strong>Independent device parameters:</strong> Each container has independent real device parameters; One-Click Refresh comprehensively refreshes them — the platform doesn't see a clone army.",
              "<strong>IP-level isolation:</strong> Each container has an independent IP; different accounts appear to the platform as coming from different home networks.",
              "<strong>AI self-adaptation:</strong> When encountering app popups, update prompts, or network fluctuations, AI auto-diagnoses and repairs — won't repeatedly click the same坐标 in front of a popup like a script."
            ]},
            { type: "h2", text: "What Still Needs Your Attention" },
            { type: "p", text: "The following operations, even with system protections, are still prone to triggering security flags once boundaries are crossed. These boundaries have been validated through extensive customer operations — <strong>it's not that you CAN'T do them, but that you must stay within range</strong>." },
            { type: "table", headers: ["Operation", "Safe Boundary", "Why"],
              rows: [
                ["<strong>First Login</strong>", "Must be done manually by a human; cannot batch auto-login", "Login is the most密集 platform security checkpoint — CAPTCHAs, human verification, device trust establishment all happen here. Batch auto-login is the highest-risk operation"],
                ["<strong>New Account First 3 Days</strong>", "Quiet period — don't change avatar/nickname/bio/password, don't bind phone/email, don't post/DM/mass comment. Only warming (browsing + searching + light likes/bookmarks)", "New accounts are under the highest platform security scrutiny. Any \"profile modification\" or \"outbound content\" behavior during these 3 days triggers deep inspection"],
                ["<strong>Posting Frequency</strong>", "Per account ≤5 posts/day, recommended 1–3, interval ≥3 hours", "Real people don't post 10 times a day. Excessive frequency directly triggers content spam detection"],
                ["<strong>DM Frequency</strong>", "Per account daily cap (varies by platform); new accounts recommended ≤10/day, 30–60 min intervals", "DMs are the most sensitive social behavior. Dense DMs from new accounts = marketing account flag"],
                ["<strong>Device Switch Frequency</strong>", "After binding an account to a container, don't switch devices within 3 days", "Frequent login device switching is typical account theft behavior; platforms are extremely sensitive to this"],
                ["<strong>Proxy Swap Sequence</strong>", "Disable first → then unbind → bind new proxy → enable (sequence must not be wrong)", "Direct unbinding briefly exposes the device's real IP — all your devices on the platform may share an exit IP; exposing one exposes all"],
                ["<strong>Proxy Sharing Count</strong>", "One proxy max 5 devices (recommended 2–3)", "Too many account activities under the same IP will be判定 as a \"device farm\""],
                ["<strong>Batch Operation Scale</strong>", "Same-platform same-operation recommended in batches of 10–20 accounts, 1–2 hour intervals between batches", "50 accounts posting simultaneously — even with different content and random times, the platform detects anomalous clustering at the statistical level"],
                ["<strong>Multi-Account Same Content</strong>", "Each account's content must have differences — different titles, images, hashtags", "Placeholders and custom parameters in Batch Operations are designed for this. Multiple accounts posting identical content = platform identifies as marketing matrix within seconds"],
                ["<strong>Age Setting</strong>", "When registering, don't set birth year below 18", "Minor accounts trigger special platform controls — restricted features, restricted content recommendations, even forced privacy mode"]
              ]
            },
            { type: "warn", text: "<strong>⚠️ Severe warning — the following behaviors have a high probability of causing batch bans:</strong><br>① Batch auto-login (non-manual)<br>② All accounts posting completely identical content (titles, images, hashtags character-for-character the same)<br>③ All accounts executing the same operation at the same minute<br>④ Using data center IPs or free proxies<br>⑤ Heavy posting and DMs during new account first 3 days" },
            { type: "h2", text: "What to Do When an Account Gets Flagged" },
            { type: "p", text: "Even with strict adherence to all the above recommendations, social platform security rules are constantly evolving — occasional flagging is normal. The key is knowing how to respond:" },
            { type: "ol", items: [
              "<strong>Assess severity:</strong> Views in single/double digits = shadowbanned (de-weighted); Can't receive verification codes / forced logout / identity verification required = under heightened scrutiny; Account disappeared / can't log in = banned.",
              "<strong>Shadowbanned account:</strong> Pause all posting and DM tasks for that account; continue warming behavior for 3–5 days. If traffic recovers, continue using; if persistently不恢复, abandon and switch accounts.",
              "<strong>Banned account:</strong> Basically unrecoverable. Execute the \"Device Reset → One-Click Refresh\" standard workflow on that device and start fresh with a new account.",
              "<strong>Investigate cascading impact:</strong> Reverse-query in Association Center — are other accounts sharing the same proxy with the problematic account also showing anomalies? If yes, the proxy may have been flagged by the platform and needs replacement.",
              "<strong>Notify platform support:</strong> If it's a large-scale, simultaneous, same-platform issue, it could be a platform security rule upgrade. Platform support will assess whether execution strategies and parameter models need adjustment."
            ]},
            { type: "tip", text: "<strong>Mindset advice:</strong> In matrix operations, occasional individual account flagging is normal attrition — like a restaurant occasionally having spoiled ingredients. The key is that the整体盘子 is healthy. As long as your asset sources are reliable, operations stay within safe boundaries, and you know how to respond when issues arise — individual account fluctuations won't affect the全局." }
          ]
        }
      ]
    },
    {

      sections: [
        {

        {
          id: "appendix-faq",
          title: "FAQ",
          blocks: [
            { type: "h1", text: "Frequently Asked Questions" },
            { type: "h3", text: "Q: Screen mirror stuck on \"Mirroring\", desktop won't light up?" },
            { type: "p", text: "The container's screen mirror may already be open in another page. Check if other browser tabs are also using the same container. Try closing other tabs and refreshing." },
            { type: "image", src: "http://47.87.66.98:3000/images/screen-troubleshoot.png", caption: "Fig: Screen mirror troubleshooting and repair", alt: "Screen troubleshooting screenshot" },
            { type: "h3", text: "Q: File upload error — container cannot find disk?" },
            { type: "p", text: "Restart the container to resolve. The platform has built-in app popup detection and error inspection routines; most such issues auto-recover after restart." },
            { type: "h3", text: "Q: Device Management and Social Media Center both have grouping features — what's the difference?" },
            { type: "p", text: "The platform is designed with a \"general — specific — general\" structure. One container can install multiple social apps but corresponds to only one network IP; one social app account can only correspond to one container. Therefore — Device Management grouping is <strong>container-dimension</strong>; Social Media Center grouping is <strong>account-dimension</strong> (and only for the current platform). Global grouping status can be queried in System Management." },
            { type: "h3", text: "Q: Group control not syncing, some devices unresponsive?" },
            { type: "p", text: "Usually the browser clipboard permission is not enabled. Check Chrome settings for the site's clipboard permission status and set to \"Allow\". Recommend using incognito window and enabling clipboard permission beforehand." },
            { type: "h3", text: "Q: After associating devices with a plan, tasks don't appear in the schedule?" },
            { type: "p", text: "Check if the plan's task repeat type is set to \"Once\". It needs to be \"Daily\" or \"Weekly\" for recurring execution and schedule appearance." },
            { type: "h3", text: "Q: What's the correct sequence for swapping network proxies?" },
            { type: "p", text: "Disable first → then unbind → bind new proxy → enable. The sequence must not be wrong; direct unbinding may briefly expose the device's real IP." },
            { type: "h3", text: "Q: Can account first login be done in batch automatically?" },
            { type: "p", text: "No. Login operations are the highest-density platform security checkpoint; batch auto-login极易 triggers security flags. <strong>First login MUST be done manually by a human.</strong> Subsequent daily operations are auto-managed by the system." },
            { type: "h3", text: "Q: Account got restricted/shadowbanned — what to do?" },
            { type: "p", text: "If account post views persistently stay in single or double digits, or you receive platform verification/warning, the account has been flagged by platform security. Steps: <strong>contact admin</strong> to execute the <a href=\"#admin-assets\">\"Device Reset → One-Click Refresh\" standard workflow</a> on that container, then switch to a new account. The original account can keep valuable content, but继续用 that device to operate it has little意义." },
            { type: "h3", text: "Q: How to tell if an account should be abandoned?" },
            { type: "p", text: "If account post views <strong>persistently stay in single or double digits</strong> with no growth trend — the account has been de-weighted by the platform; recommend abandoning. <a href=\"#admin-assets\">Reset device and switch to a new account</a>. Healthy accounts should have continuously growing view counts and interaction data." },
            { type: "h3", text: "Q: What's the difference between managing 50 accounts vs 5?" },
            { type: "p", text: "On the platform, <strong>managing 50 accounts and 5 accounts is essentially no different</strong>, and time investment is also roughly the same. You configure strategies and templates; devices auto-execute according to strategy — not manual one-by-one operation. The only exception is <strong>batch DMs</strong>: each account has a daily DM cap, so more accounts require batch scheduling." },
            { type: "h3", text: "Q: When platform rules change (e.g., TikTok security upgrade), will the platform update?" },
            { type: "p", text: "Yes. The platform team continuously monitors social platform security rule changes and <strong>remotely pushes version updates</strong> after adapting; customers don't need to manually upgrade. For emergency rule changes, platform support proactively notifies affected customers." },
            { type: "h3", text: "Q: What types of grouping does the platform have?" },
            { type: "p", text: "Three grouping modes, non-conflicting: <strong>① Phone Device Grouping</strong> (Device Management → Phone Management) — group by physical container; <strong>② Account Grouping</strong> (Social Media Center → within each platform) — group by social account; <strong>③ Network Proxy Grouping</strong> (manage by provider/region in Network Config). Use the three grouping types交叉 to flexibly organize resources for different customers and projects." },
            { type: "h3", text: "Q: Will multiple people logging into the platform simultaneously conflict?" },
            { type: "p", text: "The platform supports multiple people logging in with multiple accounts simultaneously without mutual interference. However, <strong>a single cloud phone can only be controlled by one person at a time</strong> — if a second person tries to use an already-occupied cloud phone, the screen mirror will show \"Occupied by XX\". If the second person forces takeover, the first person's session will be kicked out. Recommend the team internally agree on who is responsible for which containers to avoid mutual抢占." }
          ]
        },
        {
          id: "appendix-restrictions",
          title: "Usage Restrictions",
          blocks: [
            { type: "h1", text: "Usage Restrictions" },
            { type: "p", text: "To ensure compliant platform operations and social media ecosystem health, the following activities are prohibited using the platform:" },
            { type: "ol", items: [
              "Prohibited from use in fraud, false advertising, selling counterfeits,刷单炒信, and other activities violating laws, regulations, and commercial integrity",
              "Prohibited from publishing or distributing pornography, gambling, drugs, violence, terrorism, hate speech, and other illegal or违规 content",
              "Prohibited from impersonating others or fabricating identities for fraud, or unauthorized use of others' trademarks, likenesses, copyrights, and other legal rights",
              "Prohibited from use in online water armies, malicious opinion manipulation, defamation or贬低 competitors, and other behaviors disrupting market order",

              "Prohibited from subleasing, reselling, or otherwise providing platform capabilities to unauthorized third parties"
            ]},
            { type: "p", text: "Violations of the above usage restrictions will be严肃处理, including but not limited to immediate account suspension. For more information on rights, obligations, and responsibilities regarding product usage, refer to the Terms of Use and Privacy Policy." }
          ]
        },
        {
          id: "appendix-support",
          title: "Customer Support",
          blocks: [
            { type: "h1", text: "Customer Support" },
            { type: "p", text: "When encountering issues that cannot be resolved through the manual, contact platform technical support. To help resolve issues faster and more precisely, <strong>please prepare the following information before submitting</strong> — following this prep can double troubleshooting efficiency." },
            { type: "h2", text: "Before Submitting a Ticket, Prepare These Three" },
            { type: "table", headers: ["What to Prepare", "Where to Find It", "Why It's Needed"],
              rows: [
                ["<strong>Issue screenshot/recording</strong>", "Capture current screen from Screen Mirroring Matrix; or use browser screenshot of the whole page", "Lets support see what you're seeing — 10× more accurate than text descriptions"],
                ["<strong>Device IP or Device Number</strong>", "Phone Management → Device IP column (globally unique platform identifier); or double-click container top in Screen Mirroring Matrix to view note/number", "Support needs to locate the specific problematic container"],
                ["<strong>Task ID or Execution Time</strong>", "Task Management → expand the problematic task → record task number or execution time period", "Quickly find the corresponding execution logs instead of searching blindly"]
              ]
            },
            { type: "tip", text: "<strong>📸 Screenshots beat recordings, recordings beat text.</strong> A single issue screenshot can reduce troubleshooting time from 15 minutes to 2 minutes. Especially the execution screenshot when a task fails — logs only tell you \"failed\"; a screenshot lets you see at a glance whether an app popup blocked it or the network dropped." },
            { type: "h2", text: "When You Must Contact Technical Support" },
            { type: "ol", items: [
              "<strong>Platform functionality anomalies:</strong> Widespread screen mirror black screens, all tasks failing, pages blank/not loading — contact immediately if restart and refresh are ineffective.",
              "<strong>Task capability anomalies:</strong> Same capability repeatedly failing (after ruling out account and proxy issues) — the underlying capability may need an adaptation update.",
              "<strong>New platform adaptation needed:</strong> Business requires coverage of new social platforms (e.g., expanding from TikTok to Instagram, WhatsApp, etc.) —希望 platform support评估 adaptation plan and timeline.",
              "<strong>Custom capability needed:</strong> Special business requirements not covered by standard task capabilities — need to discuss custom development.",
              "<strong>Major platform security rule changes:</strong> Sudden social platform rule changes (e.g., TikTok mass ban wave) — platform support proactively notifies affected customers; if you discover anomalies first, please also sync to platform support promptly.",
              "<strong>Account permission issues:</strong> Add/remove accounts, password resets, permission changes — these are operated by SSO admins; contact platform support if assistance is needed."
            ]},
            { type: "h2", text: "Contact Methods" },
            { type: "p", text: "Please contact your <strong>platform customer representative</strong> (contact channel established during deployment and delivery). If the representative has changed, contact us through the following methods:" },
            { type: "ul", items: [
              "<strong>WeCom / WeChat:</strong> Contact your platform business or technical representative (added during deployment)",
              "<strong>Email:</strong> Send to the representative's email, CC relevant operations and technical staff",
              "<strong>Urgent situations:</strong> Call the representative —适用于 large-scale outages seriously impacting business operations"
            ]},
            { type: "tip", text: "<strong>💡 Pro tip:</strong> We recommend the team designates <strong>one point of contact</strong> to interface with platform support uniformly. Multiple people contacting separately容易造成信息不对称 — Person A is already handling it but Person B reports it again; Person C's issue and Person D's issue are actually the same root cause. One person coordinating收发 is most efficient." }
          ]
        }
      ]
    }
  ]
};
</script>

<script>
// ============================================================
//  ⚙️ 渲染引擎 —— 不需要动下面
// ============================================================

let editing = false;
let pendingMediaTarget = null;
let currentLang = 'zh';
function getManual() { return currentLang === 'zh' ? MANUAL : MANUAL_EN; }

function phSVG(label) {
  return "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">'
    + '<rect fill="#f1f5f9" width="800" height="280"/>'
    + '<rect x="300" y="100" width="200" height="80" rx="8" fill="#e2e8f0"/>'
    + '<text x="400" y="140" text-anchor="middle" fill="#94a3b8" font-size="28" font-family="sans-serif">📸</text>'
    + '<text x="400" y="175" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="sans-serif">' + label + '</text>'
    + '</svg>'
  );
}

function slugify(text) {
  return text.replace(/<[^>]+>/g, '')
    .replace(/[^\w一-鿿㐀-䶿]/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .toLowerCase();
}

function renderBlock(block, sectionId, blockIdx) {
  var d = function(s) { return s || ''; };
  switch (block.type) {
    case 'h1': return '<h1>' + d(block.text) + '</h1>';
    case 'h2': return '<h2 id="' + slugify(d(block.text)) + '">' + d(block.text) + '</h2>';
    case 'h3': return '<h3 id="' + slugify(d(block.text)) + '">' + d(block.text) + '</h3>';
    case 'p':  return '<p>' + d(block.text) + '</p>';
    case 'ul': return '<ul>' + (block.items || []).map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>';
    case 'ol': return '<ol>' + (block.items || []).map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ol>';
    case 'tip': return '<div class="tip">' + d(block.text) + '</div>';
    case 'warn': return '<div class="warn">' + d(block.text) + '</div>';
    case 'flow': return '<div class="flow-diagram">' + d(block.html) + '</div>';
    case 'table':
      var th = (block.headers || []).map(function(h) { return '<th>' + h + '</th>'; }).join('');
      var trs = (block.rows || []).map(function(row) {
        return '<tr>' + row.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
      }).join('');
      return '<table><thead><tr>' + th + '</tr></thead><tbody>' + trs + '</tbody></table>';
    case 'image':
      var src = block.src || '';
      var imgTag = src
        ? '<img src="' + src + '" alt="' + d(block.alt) + '" onclick="onMediaClick(\'' + sectionId + '\',' + blockIdx + ',\'image\')">'
        : '<div class="media-placeholder" onclick="onMediaClick(\'' + sectionId + '\',' + blockIdx + ',\'image\')"><span class="ph-icon">🖼️</span><span>' + d(block.alt || '截图占位') + '</span><span style="font-size:12px">编辑模式中点击此处替换</span></div>';
      return '<div class="media-block" data-section="' + sectionId + '" data-block="' + blockIdx + '">'
        + imgTag
        + (block.caption ? '<div class="caption">' + block.caption + '</div>' : '')
        + '<div class="media-edit-overlay"><button onclick="event.stopPropagation();openEditPanel(\'' + sectionId + '\',' + blockIdx + ')">✏️ 编辑</button></div>'
        + '</div>';
    case 'video':
      var vidHTML = '';
      if (!block.src) {
        vidHTML = '<div class="media-placeholder" onclick="onMediaClick(\'' + sectionId + '\',' + blockIdx + ',\'video\')"><span class="ph-icon">🎬</span><span>视频占位</span><span style="font-size:12px">编辑模式中添加视频链接或文件</span></div>';
      } else if (block.src.indexOf('<iframe') === 0 || block.src.indexOf('&lt;iframe') === 0) {
        var clean = block.src.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
        vidHTML = clean;
      } else {
        vidHTML = '<video controls width="100%" style="max-height:500px"><source src="' + block.src + '"></video>';
      }
      return '<div class="media-block" data-section="' + sectionId + '" data-block="' + blockIdx + '">'
        + vidHTML
        + (block.caption ? '<div class="caption">' + block.caption + '</div>' : '')
        + '<div class="media-edit-overlay"><button onclick="event.stopPropagation();openEditPanel(\'' + sectionId + '\',' + blockIdx + ')">✏️ 编辑</button></div>'
        + '</div>';
    default: return '';
  }
}

function renderAll() {
  var M = getManual();
  var nav = document.getElementById('nav');
  var allSections = [];
  M.groups.forEach(function(g) { allSections = allSections.concat(g.sections); });
  var realSections = allSections.filter(function(s) { return !s._subgroup; });
  var firstId = realSections.length > 0 ? realSections[0].id : '';

  // 新手模式关键章节
  var beginnerIds = ['intro','env-req','quick-login','quick-start','team-guide','pain-points','device-screen','social-routing','social-account','social-schedule','social-batch','device-task-mgr','data-center','appendix-faq'];

  // 标签映射
  var sectionTags = {
    'quick-start': { cls: 'tag-first', text: '首次' },
    'intro': { cls: 'tag-newbie', text: '新手' },
    'quick-login': { cls: 'tag-newbie', text: '新手' },
    'env-req': { cls: 'tag-newbie', text: '新手' },
    'device-screen': { cls: 'tag-newbie', text: '新手' },
    'social-account': { cls: 'tag-newbie', text: '新手' },
    'social-routing': { cls: 'tag-newbie', text: '新手' },
    'team-guide': { cls: 'tag-newbie', text: '新手' },
    'pain-points': { cls: 'tag-help', text: '排障' },
    'admin-overview': { cls: 'tag-admin', text: '管理员' },
    'plan-mgr': { cls: 'tag-adv', text: '进阶' },
    'admin-apps': { cls: 'tag-adv', text: '进阶' }
  };

  var navHTML = '<div class="logo">' + M.logo + ' ' + M.title + '</div>';
  navHTML += '<div class="subtitle">' + M.version + ' · ' + (currentLang === 'zh' ? '最后更新 ' : 'Updated ') + M.lastUpdate + '</div>';
  navHTML += '<div class="nav-search"><input type="text" id="navSearch" placeholder="' + (currentLang === 'zh' ? '🔍 搜索章节...' : '🔍 Search...') + '" oninput="filterNav()"></div>';
  var gi = 0;
  M.groups.forEach(function(g) {
    var gid = 'nav-group-' + gi;
    navHTML += '<div class="nav-group" id="' + gid + '"><div class="group-title"><span class="group-toggle" onclick="toggleGroup(\'' + gid + '\')">−</span>' + g.name + '</div>';
    var inSubgroup = false;
    g.sections.forEach(function(s) {
      if (s._subgroup) {
        inSubgroup = true;
        navHTML += '<div class="subgroup-title" data-group="' + gid + '">' + s.title + '</div>';
      } else {
        var tag = sectionTags[s.id];
        var tagHTML = tag ? ' <span class="section-tag ' + tag.cls + '">' + tag.text + '</span>' : '';
        var isBeginner = beginnerIds.indexOf(s.id) >= 0;
        navHTML += '<a href="#' + s.id + '" data-section="' + s.id + '" data-group="' + gid + '" class="' + (s.id === firstId ? 'active' : '') + (inSubgroup ? ' sub-item' : '') + (isBeginner ? ' beginner-link' : '') + '">' + s.title + tagHTML + '</a>';
      }
    });
    navHTML += '</div>';
    gi++;
  });
  navHTML += '<div class="toolbar">';
  navHTML += '<button class="btn" id="btnLangToggle" onclick="toggleLang()" style="width:100%;font-weight:600">' + (currentLang === 'zh' ? '🌐 EN' : '🌐 中文') + '</button>';
  navHTML += '<button class="btn mode-toggle" id="btnBeginnerMode" onclick="toggleBeginnerMode()" style="width:100%">' + (currentLang === 'zh' ? '🌱 新手模式' : '🌱 Beginner') + '</button>';
  navHTML += '</div>';
  nav.innerHTML = navHTML;

  var main = document.getElementById('main');
  var mainHTML = '';
  realSections.forEach(function(s) {
    var isBeginner = beginnerIds.indexOf(s.id) >= 0;
    mainHTML += '<section id="' + s.id + '" class="' + (s.id === firstId ? 'active' : '') + (isBeginner ? ' beginner' : '') + '">';
    if (s.summary) mainHTML += '<div class="section-summary">💡 <strong>' + (currentLang === 'zh' ? '这节教你：' : 'What you\'ll learn:') + '</strong>' + s.summary + '</div>';
    if (editing) {
      mainHTML += '<div class="section-toolbar">';
      mainHTML += '<button class="btn" onclick="openEditPanel(\'' + s.id + '\',null)" style="font-size:12px;padding:4px 8px;">✏️ 改标题</button>';
      mainHTML += '<button class="btn" onclick="addBlock(\'' + s.id + '\')" style="font-size:12px;padding:4px 8px;">➕ 加内容</button>';
      mainHTML += '<button class="btn danger" onclick="deleteSection(\'' + s.id + '\')" style="font-size:12px;padding:4px 8px;">🗑 删章节</button>';
      mainHTML += '</div>';
    }
    s.blocks.forEach(function(b, i) {
      var isMedia = (b.type === 'image' || b.type === 'video');
      if (editing && !isMedia) {
        mainHTML += '<div class="edit-block" onclick="openEditPanel(\'' + s.id + '\',' + i + ')"><span class="edit-block-hint">✏️ 编辑</span>';
      }
      mainHTML += renderBlock(b, s.id, i);
      if (editing && !isMedia) mainHTML += '</div>';
    });
    mainHTML += '</section>';
  });
  main.innerHTML = mainHTML;

  var links = document.querySelectorAll('nav a[data-section]');
  links.forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var id = link.dataset.section;
      document.querySelectorAll('section').forEach(function(s) { s.classList.remove('active'); });
      links.forEach(function(l) { l.classList.remove('active'); });
      var sec = document.getElementById(id);
      if (sec) sec.classList.add('active');
      link.classList.add('active');
      history.replaceState(null, '', '#' + id);
    });
  });

  var hash = location.hash.replace('#', '');
  if (hash) {
    var sec = document.getElementById(hash);
    if (sec && sec.tagName === 'SECTION') {
      // section 级跳转
      document.querySelectorAll('section').forEach(function(s) { s.classList.remove('active'); });
      links.forEach(function(l) { l.classList.remove('active'); });
      sec.classList.add('active');
      var hl = document.querySelector('nav a[data-section="' + hash + '"]');
      if (hl) hl.classList.add('active');
    } else if (sec) {
      // 页内锚点（h2/h3）：激活其所在 section 后滚动到该元素
      var parentSec = sec.closest('section');
      if (parentSec) {
        document.querySelectorAll('section').forEach(function(s) { s.classList.remove('active'); });
        links.forEach(function(l) { l.classList.remove('active'); });
        parentSec.classList.add('active');
        var hl2 = document.querySelector('nav a[data-section="' + parentSec.id + '"]');
        if (hl2) hl2.classList.add('active');
        setTimeout(function(){ sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
      }
    }
  }
}

// ── 导航搜索 ──
function filterNav() {
  var q = (document.getElementById('navSearch').value || '').toLowerCase();
  var links = document.querySelectorAll('nav a[data-section]');
  var subgroups = document.querySelectorAll('nav .subgroup-title');
  var groups = document.querySelectorAll('nav .group-title');
  if (!q) {
    links.forEach(function(l) { l.style.display = ''; });
    subgroups.forEach(function(s) { s.style.display = ''; });
    groups.forEach(function(g) { g.style.display = ''; });
    return;
  }
  var shownGroups = {};
  links.forEach(function(l) {
    var match = l.textContent.toLowerCase().indexOf(q) >= 0;
    l.style.display = match ? '' : 'none';
    if (match && l.dataset.group) shownGroups[l.dataset.group] = true;
  });
  subgroups.forEach(function(s) {
    s.style.display = s.dataset.group && shownGroups[s.dataset.group] ? '' : 'none';
  });
  // groups are wrapper divs
  var wrappers = document.querySelectorAll('nav .nav-group');
  wrappers.forEach(function(w) {
    var gid = w.id;
    var hasVisible = false;
    links.forEach(function(l) { if (l.dataset.group === gid && l.style.display !== 'none') hasVisible = true; });
    subgroups.forEach(function(s) { if (s.dataset.group === gid && s.style.display !== 'none') hasVisible = true; });
    var titleEl = w.querySelector('.group-title');
    if (titleEl && titleEl.textContent.replace(/[−+]/g,'').toLowerCase().indexOf(q) >= 0) hasVisible = true;
    w.style.display = hasVisible ? '' : 'none';
  });
}

// ── 分组折叠 ──
function toggleGroup(gid) {
  var group = document.getElementById(gid);
  if (!group) return;
  group.classList.toggle('collapsed');
  group.querySelector('.group-toggle').textContent = group.classList.contains('collapsed') ? '+' : '−';
}

// ── 新手模式 ──
var beginnerMode = false;
function toggleBeginnerMode() {
  beginnerMode = !beginnerMode;
  document.body.classList.toggle('beginner-mode', beginnerMode);
  var btn = document.getElementById('btnBeginnerMode');
  if (currentLang === 'zh') {
    btn.textContent = beginnerMode ? '📖 完整模式' : '🌱 新手模式';
  } else {
    btn.textContent = beginnerMode ? '📖 Full Mode' : '🌱 Beginner';
  }
  btn.classList.toggle('mode-toggle', !beginnerMode);
}

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  // Store preference
  try { localStorage.setItem('manual-lang', currentLang); } catch(e) {}
  // Notify parent page of language change
  try { window.parent.postMessage({ type: 'lang-changed', lang: currentLang }, '*'); } catch(e) {}
  renderAll();
  // Restore active section
  var hash = location.hash.replace('#', '');
  if (hash) {
    var sec = document.getElementById(hash);
    if (sec) { sec.classList.add('active'); }
  }
}

function findSection(id) {
  var M = getManual();
  for (var gi = 0; gi < M.groups.length; gi++) {
    for (var si = 0; si < M.groups[gi].sections.length; si++) {
      if (M.groups[gi].sections[si].id === id) return M.groups[gi].sections[si];
    }
  }
  return null;
}

function onMediaClick(sectionId, blockIdx, mediaType) {
  var s = findSection(sectionId);
  if (!s) return;
  var block = s.blocks[blockIdx];
  if (editing) {
    if (block.src) {
      openEditPanel(sectionId, blockIdx);
    } else {
      pendingMediaTarget = { sectionId: sectionId, blockIdx: blockIdx };
      if (mediaType === 'image') {
        document.getElementById('imageInput').click();
      } else {
        document.getElementById('videoInput').click();
      }
    }
  } else {
    if (mediaType === 'image' && block.src) {
      document.getElementById('lightboxImg').src = block.src;
      document.getElementById('lightbox').classList.add('show');
    }
  }
}

function handleMediaFile(file) {
  if (!file || !pendingMediaTarget) return;
  var reader = new FileReader();
  reader.onload = function() {
    var s = findSection(pendingMediaTarget.sectionId);
    if (s) {
      s.blocks[pendingMediaTarget.blockIdx].src = reader.result;
      renderAll();
      // 如果编辑面板开着（从编辑面板中选的本地文件），关闭它——变更已通过 renderAll 生效，面板中残留的旧 URL 会在点"应用"时覆盖新文件
      if (currentEdit) closeEditPanel();
    }
    pendingMediaTarget = null;
  };
  reader.readAsDataURL(file);
}

document.getElementById('imageInput').addEventListener('change', function() {
  handleMediaFile(this.files[0]); this.value = '';
});
document.getElementById('videoInput').addEventListener('change', function() {
  handleMediaFile(this.files[0]); this.value = '';
});

var currentEdit = null;

function openEditPanel(sectionId, blockIdx) {
  currentEdit = { sectionId: sectionId, blockIdx: blockIdx };
  var section = findSection(sectionId);
  if (!section) return;
  var panel = document.getElementById('panelBody');

  if (blockIdx === null) {
    panel.innerHTML = '<div class="field"><label>章节标题</label><input id="efSectionTitle" value="' + escAttr(section.title) + '"></div>';
    document.getElementById('btnApplyEdit').onclick = function() {
      section.title = document.getElementById('efSectionTitle').value;
      currentEdit = null;
      renderAll();
      closeEditPanel();
    };
  } else {
    var block = section.blocks[blockIdx];
    var html = '';
    html += '<div style="margin-bottom:16px;font-size:12px;color:var(--text-secondary)">第 ' + (blockIdx + 1) + ' / ' + section.blocks.length + ' 块';
    if (blockIdx > 0) html += ' <button class="btn" onclick="openEditPanel(\'' + sectionId + '\',' + (blockIdx - 1) + ')" style="font-size:11px;padding:2px 6px;">◀ 上一块</button>';
    if (blockIdx < section.blocks.length - 1) html += ' <button class="btn" onclick="openEditPanel(\'' + sectionId + '\',' + (blockIdx + 1) + ')" style="font-size:11px;padding:2px 6px;">下一块 ▶</button>';
    html += '</div>';
    html += '<div style="margin-bottom:14px;display:flex;gap:6px;">';
    if (blockIdx > 0) html += '<button class="btn" onclick="moveBlock(\'' + sectionId + '\',' + blockIdx + ',-1)" style="font-size:12px;padding:4px 10px;">▲ 上移</button>';
    if (blockIdx < section.blocks.length - 1) html += '<button class="btn" onclick="moveBlock(\'' + sectionId + '\',' + blockIdx + ',1)" style="font-size:12px;padding:4px 10px;">▼ 下移</button>';
    html += '</div>';

    html += '<div class="field"><label>类型</label><select id="efType">';
    var types = [
      { v: 'h1', n: '一级标题' }, { v: 'h2', n: '二级标题' }, { v: 'h3', n: '三级标题' },
      { v: 'p', n: '段落' }, { v: 'ul', n: '无序列表' }, { v: 'ol', n: '有序列表' },
      { v: 'tip', n: '提示框' }, { v: 'warn', n: '警告框' }, { v: 'table', n: '表格' },
      { v: 'image', n: '图片' }, { v: 'video', n: '视频' }
    ];
    types.forEach(function(t) {
      html += '<option value="' + t.v + '"' + (block.type === t.v ? ' selected' : '') + '>' + t.n + '</option>';
    });
    html += '</select></div>';

    if (['h1','h2','h3','p','tip','warn'].indexOf(block.type) >= 0) {
      html += '<div class="field"><label>文字内容（可使用 &lt;strong&gt;、&lt;code&gt; 等标签）</label><textarea id="efText" rows="4">' + escHtml(block.text || '') + '</textarea></div>';
    }
    if (['ul','ol'].indexOf(block.type) >= 0) {
      html += '<div class="field"><label>列表项（每行一项）</label><textarea id="efItems" rows="5">' + escHtml((block.items || []).join('\n')) + '</textarea></div>';
    }
    if (block.type === 'table') {
      html += '<div class="field"><label>表头（逗号分隔）</label><input id="efHeaders" value="' + escAttr((block.headers || []).join(',')) + '"></div>';
      html += '<div class="field"><label>数据行（每行一行，单元格逗号分隔）</label><textarea id="efRows" rows="5">' + escHtml((block.rows || []).map(function(r) { return r.join(','); }).join('\n')) + '</textarea></div>';
    }
    if (['image','video'].indexOf(block.type) >= 0) {
      html += '<div class="field"><label>' + (block.type === 'image' ? '图片' : '视频') + '来源</label>';
      html += '<div style="display:flex;gap:8px;margin-bottom:8px;">';
      html += '<button class="btn" onclick="pickMediaFile(\'' + sectionId + '\',' + blockIdx + ',\'' + block.type + '\')" style="font-size:12px;">📁 选本地文件</button>';
      html += '<span style="font-size:11px;color:var(--text-secondary);line-height:2.2">或粘贴链接</span>';
      html += '</div>';
      html += '<input id="efSrc" value="' + escAttr(block.src || '') + '" placeholder="' + (block.type === 'image' ? 'images/xxx.png 或 https://...' : 'https://... 或 <iframe> 嵌入代码') + '">';
      html += '</div>';
    }
    if (['image'].indexOf(block.type) >= 0) {
      html += '<div class="field"><label>替代文字</label><input id="efAlt" value="' + escAttr(block.alt || '') + '"></div>';
    }
    if (['image','video'].indexOf(block.type) >= 0) {
      html += '<div class="field"><label>图注 / 说明文字</label><input id="efCaption" value="' + escAttr(block.caption || '') + '"></div>';
    }

    html += '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">';
    html += '<button class="btn danger" onclick="deleteBlock(\'' + sectionId + '\',' + blockIdx + ')" style="width:100%">🗑 删除此内容块</button>';
    panel.innerHTML = html;

    document.getElementById('efType').addEventListener('change', function() {
      var newType = this.value;
      var oldType = block.type;
      if (['h1','h2','h3','p','tip','warn'].indexOf(oldType) >= 0) block._tmpText = document.getElementById('efText') ? document.getElementById('efText').value : (block.text || '');
      if (['ul','ol'].indexOf(oldType) >= 0) block._tmpItems = document.getElementById('efItems') ? document.getElementById('efItems').value : (block.items || []).join('\n');
      if (oldType === 'table') {
        block._tmpHeaders = document.getElementById('efHeaders') ? document.getElementById('efHeaders').value.split(',') : (block.headers || []);
        block._tmpRows = document.getElementById('efRows') ? document.getElementById('efRows').value.split('\n').map(function(r) { return r.split(','); }) : (block.rows || []);
      }
      if (['image','video'].indexOf(oldType) >= 0) {
        block._tmpSrc = document.getElementById('efSrc') ? document.getElementById('efSrc').value : (block.src || '');
        block._tmpCaption = document.getElementById('efCaption') ? document.getElementById('efCaption').value : (block.caption || '');
        block._tmpAlt = document.getElementById('efAlt') ? document.getElementById('efAlt').value : (block.alt || '');
      }
      // Switch
      if (['h1','h2','h3','p','tip','warn'].indexOf(newType) >= 0) { block.text = block._tmpText || ''; delete block.items; delete block.src; delete block.caption; delete block.alt; delete block.headers; delete block.rows; }
      else if (['ul','ol'].indexOf(newType) >= 0) { block.items = (block._tmpItems || '').split('\n').filter(Boolean); delete block.text; delete block.src; delete block.caption; delete block.alt; delete block.headers; delete block.rows; }
      else if (newType === 'table') { block.headers = block._tmpHeaders || []; block.rows = block._tmpRows || []; delete block.text; delete block.items; delete block.src; delete block.caption; delete block.alt; }
      else if (['image'].indexOf(newType) >= 0) { block.src = block._tmpSrc || ''; block.caption = block._tmpCaption || ''; block.alt = block._tmpAlt || ''; delete block.text; delete block.items; delete block.headers; delete block.rows; }
      else if (['video'].indexOf(newType) >= 0) { block.src = block._tmpSrc || ''; block.caption = block._tmpCaption || ''; delete block.text; delete block.items; delete block.headers; delete block.rows; delete block.alt; }
      block.type = newType;
      openEditPanel(sectionId, blockIdx);
    });

    document.getElementById('btnApplyEdit').onclick = function() {
      applyBlockEdit(section, blockIdx);
    };
  }
  document.getElementById('edit-panel').style.display = 'flex';
}

function applyBlockEdit(section, blockIdx) {
  var block = section.blocks[blockIdx];
  var typeEl = document.getElementById('efType');
  if (typeEl) block.type = typeEl.value;
  if (['h1','h2','h3','p','tip','warn'].indexOf(block.type) >= 0) {
    var el = document.getElementById('efText');
    if (el) block.text = el.value;
  }
  if (['ul','ol'].indexOf(block.type) >= 0) {
    var el = document.getElementById('efItems');
    if (el) block.items = el.value.split('\n').filter(Boolean);
  }
  if (block.type === 'table') {
    var el = document.getElementById('efHeaders');
    if (el) block.headers = el.value.split(',');
    el = document.getElementById('efRows');
    if (el) block.rows = el.value.split('\n').map(function(r) { return r.split(','); });
  }
  if (['image','video'].indexOf(block.type) >= 0) {
    var el = document.getElementById('efSrc');
    if (el) block.src = el.value;
    el = document.getElementById('efCaption');
    if (el) block.caption = el.value;
  }
  if (['image'].indexOf(block.type) >= 0) {
    var el = document.getElementById('efAlt');
    if (el) block.alt = el.value;
  }
  currentEdit = null;
  renderAll();
  closeEditPanel();
}

function pickMediaFile(sectionId, blockIdx, mediaType) {
  pendingMediaTarget = { sectionId: sectionId, blockIdx: blockIdx };
  if (mediaType === 'image') document.getElementById('imageInput').click();
  else document.getElementById('videoInput').click();
}

function deleteBlock(sectionId, blockIdx) {
  var s = findSection(sectionId);
  if (!s || s.blocks.length <= 1) { alert('每个章节至少保留一个内容块'); return; }
  if (!confirm('确定删除这个内容块？')) return;
  s.blocks.splice(blockIdx, 1);
  currentEdit = null;
  renderAll();
  closeEditPanel();
}

function moveBlock(sectionId, blockIdx, direction) {
  var s = findSection(sectionId);
  if (!s) return;
  var newIdx = blockIdx + direction;
  if (newIdx < 0 || newIdx >= s.blocks.length) return;
  // 交换两个块
  var tmp = s.blocks[blockIdx];
  s.blocks[blockIdx] = s.blocks[newIdx];
  s.blocks[newIdx] = tmp;
  renderAll();
  // 在新位置重新打开编辑面板
  openEditPanel(sectionId, newIdx);
}

function closeEditPanel() {
  document.getElementById('edit-panel').style.display = 'none';
  currentEdit = null;
}

function addBlock(sectionId) {
  var s = findSection(sectionId);
  if (!s) return;
  s.blocks.push({ type: 'p', text: '新段落内容' });
  renderAll();
  openEditPanel(sectionId, s.blocks.length - 1);
}

function addSection() {
  var title = prompt(currentLang === 'zh' ? '新章节标题：' : 'New section title:', currentLang === 'zh' ? '新章节' : 'New Section');
  if (!title) return;
  var id = 'custom-' + Date.now();
  var M = getManual();
  var lastGroup = M.groups[M.groups.length - 1];
  if (!lastGroup) {
    lastGroup = { name: (currentLang === 'zh' ? '自定义' : 'Custom'), sections: [] };
    M.groups.push(lastGroup);
  }
  lastGroup.sections.push({ id: id, title: title, blocks: [{ type: 'h1', text: title }, { type: 'p', text: '在此编写内容...' }] });
  renderAll();
  showSection(id);
}

function deleteSection(sectionId) {
  if (!confirm(currentLang === 'zh' ? '确定删除该章节？此操作不可恢复。' : 'Delete this section? This cannot be undone.')) return;
  var M = getManual();
  for (var gi = 0; gi < M.groups.length; gi++) {
    var idx = -1;
    for (var si = 0; si < M.groups[gi].sections.length; si++) {
      if (M.groups[gi].sections[si].id === sectionId) { idx = si; break; }
    }
    if (idx >= 0) {
      M.groups[gi].sections.splice(idx, 1);
      M.groups = M.groups.filter(function(g) { return g.sections.length > 0; });
      renderAll();
      closeEditPanel();
      var first = M.groups[0] && M.groups[0].sections[0];
      if (first) showSection(first.id);
      return;
    }
  }
}

function showSection(id) {
  document.querySelectorAll('section').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('nav a[data-section]').forEach(function(l) { l.classList.remove('active'); });
  var sec = document.getElementById(id);
  if (sec) sec.classList.add('active');
  var hl = document.querySelector('nav a[data-section="' + id + '"]');
  if (hl) hl.classList.add('active');
}

function toggleEdit() {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  var icon = document.getElementById('editIcon');
  var label = document.getElementById('editLabel');
  var btnSave = document.getElementById('btnSave');
  var btnExport = document.getElementById('btnExport');
  var btnAdd = document.getElementById('btnAddSection');
  if (editing) {
    icon.textContent = '👁️';
    label.textContent = '退出编辑';
    if (btnSave) btnSave.style.display = '';
    if (btnExport) btnExport.style.display = '';
    if (btnAdd) btnAdd.style.display = '';
    closeEditPanel();
  } else {
    icon.textContent = '✏️';
    label.textContent = '编辑模式';
    if (btnSave) btnSave.style.display = 'none';
    if (btnExport) btnExport.style.display = 'none';
    if (btnAdd) btnAdd.style.display = 'none';
    closeEditPanel();
  }
  renderAll();
}

function buildManualHTML() {
  var manualJSON = JSON.stringify(MANUAL, null, 2);
  var manualEnJSON = JSON.stringify(MANUAL_EN, null, 2);
  var html = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>' + MANUAL.title + '</title>\n';
  var styles = document.querySelector('style');
  html += '<style>\n' + (styles ? styles.textContent : '') + '\n</style>\n';
  html += '</head>\n<body>\n\n';
  html += '<nav id="nav"></nav>\n<main id="main"></main>\n\n';
  html += '<div id="edit-panel">\n  <div class="panel-header">\n    <span>📝 编辑内容</span>\n    <button class="btn" onclick="closeEditPanel()" style="font-size:12px;padding:4px 8px;">✕</button>\n  </div>\n  <div class="panel-body" id="panelBody"></div>\n  <div class="panel-footer">\n    <button class="btn" onclick="closeEditPanel()">取消</button>\n    <button class="btn primary" id="btnApplyEdit" style="flex:1">✓ 应用</button>\n  </div>\n</div>\n\n';
  html += '<div class="lightbox" id="lightbox" onclick="this.classList.remove(\'show\')">\n  <img id="lightboxImg" src="">\n</div>\n\n';
  html += '<input type="file" accept="image/*" id="imageInput" style="display:none">\n';
  html += '<input type="file" accept="video/*" id="videoInput" style="display:none">\n\n';
  html += '<script>\nconst MANUAL = ' + manualJSON + ';\nconst MANUAL_EN = ' + manualEnJSON + ';\n<\/script>\n\n';
  var scripts = document.querySelectorAll('script');
  var engineScript = '';
  for (var i = 0; i < scripts.length; i++) {
    var txt = scripts[i].textContent;
    if (txt.indexOf('渲染引擎') >= 0) { engineScript = txt; break; }
  }
  html += '<script>\n' + engineScript + '\n<\/script>\n\n';
  html += '</body>\n</html>';
  return html;
}

var fileHandle = null;

async function saveManual() {
  var html = buildManualHTML();
  try {
    if (!fileHandle) {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: 'operation-guide-' + MANUAL.version + '.html',
        types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
      });
    }
    var writable = await fileHandle.createWritable();
    await writable.write(html);
    await writable.close();
    // 短暂闪烁按钮提示保存成功
    var btn = document.getElementById('btnSave');
    if (btn) { var t = btn.textContent; btn.textContent = '✅ 已保存'; setTimeout(function() { btn.textContent = t; }, 1500); }
  } catch (e) {
    if (e.name === 'AbortError') return; // 用户取消
    // API 不可用（如通过 file:// 打开或浏览器不支持文件系统 API），回退到下载并提示
    downloadManual();
    var btn = document.getElementById('btnSave');
    if (btn) { var t2 = btn.textContent; btn.textContent = '📥 已下载新文件'; setTimeout(function() { btn.textContent = t2; }, 2500); }
    setTimeout(function() {
      alert('当前浏览器环境不支持直接保存到原文件（可能因通过 file:// 打开或浏览器不支持文件系统 API）。已将修改后的手册下载为新文件，请用它替换原 master.html，或部署到 HTTPS 环境后即可直接保存。');
    }, 100);
  }
}

function downloadManual() {
  var html = buildManualHTML();
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'operation-guide-' + MANUAL.version + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Language initialization: URL param > localStorage > default 'zh'
(function() {
  var params = new URLSearchParams(location.search);
  var urlLang = params.get('lang');
  if (urlLang === 'en' || urlLang === 'zh') {
    currentLang = urlLang;
  } else {
    try { var savedLang = localStorage.getItem('manual-lang'); if (savedLang === 'en') currentLang = 'en'; } catch(e) {}
  }
})();

// Listen for language change from parent page (postMessage)
window.addEventListener('message', function(e) {
  var data = e.data;
  if (data && data.type === 'set-lang' && (data.lang === 'zh' || data.lang === 'en')) {
    if (currentLang !== data.lang) {
      currentLang = data.lang;
      try { localStorage.setItem('manual-lang', currentLang); } catch(e) {}
      renderAll();
      var hash = location.hash.replace('#', '');
      if (hash) { var sec = document.getElementById(hash); if (sec) sec.classList.add('active'); }
    }
  }
});

renderAll();

// hash 变化时切换 section（支持场景导航中的锚点链接和页内跳转）
// 页内锚点（h2/h3）的 id 已加 sectionId 前缀保证唯一；此处用后缀匹配兼容无前缀的链接
function activateSectionById(id) {
  document.querySelectorAll('section').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('nav a[data-section]').forEach(function(l) { l.classList.remove('active'); });
  var sec = document.getElementById(id);
  if (sec && sec.tagName === 'SECTION') sec.classList.add('active');
  var hl = document.querySelector('nav a[data-section="' + id + '"]');
  if (hl) hl.classList.add('active');
}
window.addEventListener('hashchange', function() {
  var hash = location.hash.replace('#', '');
  if (!hash) return;
  // 1. section 级跳转
  var sec = document.getElementById(hash);
  if (sec && sec.tagName === 'SECTION') {
    activateSectionById(hash);
    sec.scrollIntoView({ behavior: 'smooth' });
    return;
  }
  // 2. 页内锚点（h2/h3）：精确 id 匹配
  var el = document.getElementById(hash);
  // 3. fallback：若精确匹配不到，按后缀匹配（兼容带前缀的 id）
  if (!el) {
    var matches = document.querySelectorAll('[id$="-' + hash + '"]');
    if (matches.length) el = matches[0];
  }
  if (!el) return;
  // 激活元素所在的 section（页内锚点可能位于未展示的 section 内）
  var parentSec = el.closest('section');
  if (parentSec) activateSectionById(parentSec.id);
  // 等 section 显示后再滚动
  setTimeout(function(){ el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { document.getElementById('lightbox').classList.remove('show'); }
});
