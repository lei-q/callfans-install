  :root {

    --border: #e2e8f0; --accent: #2563eb; --accent-light: #eff6ff;
    --nav-width: 260px; --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7; display: flex; min-height: 100vh;

  nav {

  nav .logo { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  nav .subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; }

    display: flex; align-items: center; gap: 6px;
  }
  nav .group-title .sys-tag {
    font-size: 9px; font-weight: 500; background: #e0e7ff; color: #4338ca;
    padding: 1px 6px; border-radius: 3px; white-space: nowrap;
  }
  nav .subgroup-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    color: #94a3b8; margin: 16px 0 4px 0;
    padding: 2px 10px; display: flex; align-items: center; gap: 5px;
  }
  nav a.sub-item { padding-left: 22px; font-size: 13px; }
  nav .nav-search { margin-bottom: 16px; }
  nav .nav-search input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; font-family: inherit; background: #f8fafc;
  }
  nav .nav-search input:focus { outline: none; border-color: var(--accent); }
  nav .group-toggle {

  .nav-group.collapsed .group-title ~ .subgroup-title,

  nav .section-tag {
    font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-left: 4px;
    font-weight: 500; white-space: nowrap;
  }
  nav .tag-newbie { background: #dcfce7; color: #166534; }
  nav .tag-admin { background: #e0e7ff; color: #3730a3; }
  nav .tag-adv { background: #fef3c7; color: #92400e; }
  nav .tag-first { background: #dbeafe; color: #1e40af; }
  nav .tag-help { background: #ffe4e6; color: #9f1239; }
  /* 编辑模式：内容块可点击 */
  .edit-block { cursor: pointer; position: relative; border-radius: 4px; transition: background .1s; }
  .edit-block:hover { background: #f8fafc; }
  .edit-block-hint {
    position: absolute; top: 2px; right: 2px; font-size: 10px;
    background: rgba(37,99,235,0.85); color: #fff; padding: 1px 6px;
    border-radius: 3px; z-index: 5; display: none;
  }
  .edit-block:hover .edit-block-hint { display: block; }
  /* 业务场景流程图 */
  .flow-diagram { margin: 20px 0; font-size: 13px; }
  .flow-section { margin-bottom: 12px; border-radius: 8px; border: 1.5px solid; padding: 12px 16px; }
  .flow-section .flow-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .flow-section.base { background: #f0fdf4; border-color: #86efac; }
  .flow-section.base .flow-label { color: #166534; }
  .flow-section.ops { background: #eff6ff; border-color: #93c5fd; }
  .flow-section.ops .flow-label { color: #1e40af; }
  .flow-section.ext { background: #faf5ff; border-color: #c4b5fd; }
  .flow-section.ext .flow-label { color: #6b21a8; }
  .flow-section .flow-items { display: flex; flex-wrap: wrap; gap: 8px; }
  .flow-item { padding: 6px 12px; border-radius: 5px; font-weight: 600; font-size: 12px; border: 1px solid; white-space: nowrap; text-decoration: none; display: inline-block; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .flow-item:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .flow-item.base-item { background: #dcfce7; border-color: #86efac; color: #166534; }
  .flow-item.ops-item { background: #dbeafe; border-color: #93c5fd; color: #1e40af; }
  .flow-item.ext-item { background: #ede9fe; border-color: #c4b5fd; color: #6b21a8; }
  .flow-connector { text-align: center; color: #94a3b8; font-size: 16px; margin: 2px 0; }
  /* 章节摘要 */
  .section-summary { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 6px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #92400e; }
  .section-summary strong { color: #78350f; }
  /* 新手模式 */

  body.beginner-mode nav a:not(.beginner-link) { opacity: 0.35; }
  .btn.mode-toggle { background: #fef3c7; border-color: #fcd34d; color: #92400e; }

  .btn {

  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.danger { color: #dc2626; border-color: #fecaca; }
  .btn.danger:hover { background: #fef2f2; }
  main { margin-left: var(--nav-width); flex: 1; padding: 40px 48px;  }
  section { display: none; }

  h3 { font-size: 16px; font-weight: 600; margin: 22px 0 6px; }
  p { margin-bottom: 12px; color: #334155; }
  ul, ol { margin: 0 0 12px 20px; color: #334155; }
  li { margin-bottom: 3px; }
  code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
  .tip {

  .warn {
    border-left: 3px solid #f59e0b; background: #fffbeb;
    padding: 12px 16px; border-radius: 0 var(--radius) var(--radius) 0; margin: 16px 0; font-size: 14px;

  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  th { background: #f8fafc; font-weight: 600; }
  td:first-child { white-space: nowrap; }
  .media-block {
    margin: 20px 0; border-radius: var(--radius); border: 1px solid var(--border);

    position: relative;
  }
  .media-block img, .media-block video { display: block; width: 100%; max-width: 100%; cursor: pointer; }
  .media-block .caption { padding: 10px 14px; font-size: 13px; color: var(--text-secondary); border-top: 1px solid var(--border); background: #f8fafc; text-align: left; }
  .media-block iframe { width: 100%; height: 450px; border: none; display: block; }
  .media-placeholder {
    background: #f1f5f9; height: 220px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; gap: 8px;

  .section-toolbar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .media-edit-overlay {

  .media-edit-overlay button {
    font-size: 11px; padding: 3px 8px; background: rgba(255,255,255,.95);
    box-shadow: 0 1px 4px rgba(0,0,0,.12); border: 1px solid var(--border);

    display: none; position: fixed; top: 0; right: 0; width: 420px; height: 100vh;
    background: var(--card); border-left: 1px solid var(--border);

  #edit-panel .panel-body { flex: 1; overflow-y: auto; padding: 20px; }
  #edit-panel .panel-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .field input, .field textarea, .field select {

  .add-block-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .add-block-btns button { font-size: 12px; padding: 5px 10px; }

  .lightbox { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,.85); cursor: zoom-out; align-items: center; justify-content: center; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

  @media (max-width: 900px) {
    nav { width: 220px; min-width: 220px; padding: 16px 12px; }
    main { margin-left: 220px; padding: 24px 16px; }
    #edit-panel { width: 100%; }
  }
</style>
</head>

            { type: "p", text: "Welcome to the <strong>AI Matrix Operations System</strong> — an AI-powered, large-scale mobile app operations platform. This guide is for <strong>deployed customers</strong>, covering complete operational instructions from login and configuration to daily maintenance. For product capabilities and version details, refer to the Product Capability Handbook." },
            { type: "image", src: "http://47.87.66.98:3000/images/登录界面.png", caption: "Fig: Platform Login Screen", alt: "Platform login page" },
            { type: "h2", text: "The Platform Has Two Entry Points" },
            { type: "table", headers: ["Entry Point", "User", "One-Line Description"],
              rows: [
                ["<strong>Operator Console</strong>", "Operators (daily use)", "The vast majority of business operations happen here — device screen mirroring, social account maintenance, content publishing, data viewing, plan configuration"],
                ["<strong>Admin Console</strong>", "Administrator / Senior Operator", "Asset management and system configuration — unified management of accounts/proxies/containers, relationship queries, capability configuration, permission assignment"]
              ]
            },
            { type: "tip", text: "<strong>Daily usage guide:</strong> Operators only need to focus on the 「Operator Console」 day to day. Administrators occasionally use the 「Admin Console」 to configure assets. Account creation, device initialization, and other low-level operations are configured once by platform support during deployment. For self-management (enterprise large customers), refer to the separate Administrator Handbook." },
            { type: "h2", text: "Operator Console (Six Modules)" },
            { type: "table", headers: ["Module", "Sub-Feature", "Description"],
              rows: [
                ["<strong>Device Management</strong>", "Screen Mirroring Matrix", "Real-time device screen viewing, mouse control, multi-device batch group control"],
                ["", "Phone Management", "Device group management, query device status and information"],
                ["", "Task Management", "Global device task query, execution records and screenshots, retry failed tasks"],
                ["", "Network Config", "Network proxy IP input, expiry reminders, binding and connectivity testing"],
                ["<strong>Social Media Center</strong>", "Per-Platform Sub-Pages", "Social account information input and container association, schedule viewing and conflict adjustment"],
                ["", "Schedule / Batch Operations", "Timed task setup and batch orchestration for warming, posting, commenting, DMs"],
                ["<strong>Data Center</strong>", "Matrix Data Monitoring", "Social account data monitoring and export — account summary, post detail, hot post ranking"],
                ["<strong>Content Center</strong>", "Asset Library", "Social media asset tiered management and team collaboration workflow"],
                ["<strong>Plan Management</strong>", "Plan Management", "Long-term automated operations plan setup and management — configure once, execute long-term across multiple devices"],
                ["<strong>Dispatch Center 🚧</strong>", "Dispatch Center", "Expected launch end of July 2026 — project-level real-time coordinated control"]
              ]
            },
            { type: "image", src: "http://47.87.66.98:3000/images/运营前台主页面.png", caption: "Fig: Operator Console Interface Overview", alt: "Platform Operator Console interface" },
            { type: "h2", text: "Admin Console (Four Modules)" },
            { type: "table", headers: ["Module", "Sub-Feature", "Description"],
              rows: [
                ["<strong>Association Center</strong>", "Association Config", "Global query of binding relationships among accounts, proxies, and devices"],
                ["<strong>Asset Management</strong>", "Account Pool / Proxy Pool / Container Pool", "Batch input and unified management of three asset types"],
                ["<strong>App Management</strong>", "App Management", "Centralized configuration management of custom RPA capabilities"],
                ["<strong>System Management</strong>", "Group Management / User Management", "Global grouping, assigning social accounts/proxies/cloud phones to users"]
              ]
            },
            { type: "image", src: "http://47.87.66.98:3000/images/运管后台主页面.png", caption: "Fig: Admin Console Interface Overview", alt: "Platform Admin Console interface" },
            { type: "h2", text: "Supported Platforms" },
            { type: "p", text: "The platform is built on a platform-agnostic architecture (simulating real phones, not relying on platform APIs). Theoretically any mobile app can be supported. <strong>Supports major global social platforms. Contact support for special requirements.</strong>" },
            { type: "table", headers: ["Region", "Platform", "Maturity"],
              rows: [
                ["Domestic (CN)", "Xiaohongshu (RED)", "★★★ Most Mature"],
                ["Domestic (CN)", "Weibo", "★★"],
                ["Domestic (CN)", "Douyin", "★★"],
                ["Overseas", "TikTok", "★★★ Most Mature"],
                ["Overseas", "Instagram", "★★"],
                ["Overseas", "Facebook", "★★"],
                ["Overseas", "YouTube", "★★"]
              ]
            },
            { type: "p", text: "WhatsApp, LINE, Telegram, Reddit, and other platforms are flexibly adapted based on customer requirements, with adaptation cycles measured in weeks. As long as the customer has a clear business scenario, it can go live." },
            { type: "tip", text: "<strong>Future roadmap:</strong> Community operations (WhatsApp/Telegram/LINE group bulk interaction) and livestream traffic蓄水 (pre-heating) features are under development, planned for after the Dispatch Center module is complete (expected end of July 2026)." }
          ]
        },
        {
          id: "core-strategy",
          title: "Core Strategy",
          summary: "The platform's operational methodology and account strategy — three-step approach, device-centric execution, three-tier account hierarchy. Understanding these before diving in will double your efficiency.",
          blocks: [
            { type: "h1", text: "Core Strategy" },
            { type: "p", text: "Before diving into specific features, establish two core mental models — <strong>how to operate</strong> and <strong>why to operate this way</strong>. These two models run through every feature module of the platform." },
            { type: "h2", text: "Core Operating Logic: The Three-Step Approach" },
            { type: "p", text: "Every feature module — whether Screen Mirroring Matrix or Social Media Center — follows the same operating logic:" },
            { type: "ol", items: [
              "<strong>Narrow scope, select targets:</strong> Use grouping, notes, custom selection, and conditional filtering to quickly locate the devices or social accounts you want to operate. Among dozens or hundreds of devices, step one is always \"identify the operation targets.\"",
              "<strong>Choose function, configure parameters:</strong> After selecting targets, choose the operation to perform (warming, posting, commenting, etc.) and configure relevant parameters.",
              "<strong>View execution results:</strong> Check execution status, screenshots, and output documents in Task Management to confirm results."
            ]},
            { type: "tip", text: "<strong>🔑 Key insight: Tasks originate from devices.</strong> A cloud phone can install multiple social apps and log into multiple accounts across different platforms. But the execution entity for all tasks is always <strong>a specific device</strong> — when you select accounts in Social Media Center, the system ultimately dispatches the bound device to execute. Understanding this \"device executes, account is the operand\" relationship makes all subsequent features much easier to grasp." },
            { type: "h2", text: "Account Tier Strategy" },
            { type: "p", text: "Matrix operations aren't about mechanical copy-paste — managing 50 accounts as 50 individual accounts will produce poor results. The right approach is to divide accounts into <strong>three tiers</strong>, each with different positioning and operational strategies:" },
            { type: "table", headers: ["Tier", "Alias", "Positioning", "Strategy"],
              rows: [
                ["<strong>Core Account</strong>", "Brand Main Account", "The core outlet for brand image and product communication", "Operate exactly like a real phone — create polished content, pursue precision, effectiveness, and value. Quality over quantity"],
                ["<strong>Wingman Account</strong>", "Marketing Account", "Rapid, high-volume amplification of core account content and product selling points", "Massive information feed content deployed here. Volume for exposure — amplify the core account's voice to every corner"],
                ["<strong>Grassroots Account</strong>", "Word-of-Mouth Account", "Brand sentiment maintenance and user insight", "Scattered around target audiences, understanding what users think and care about — gathering intel, guiding sentiment, spreading word-of-mouth"]
              ]
            },
            { type: "tip", text: "<strong>💡 Simple memory aid:</strong> Core Account = your official voice, Wingman Account = your megaphone, Grassroots Account = your ears and mouth. All three working together creates the complete matrix effect — any single one leaves you with a missing leg." }
          ]
        },
        {
          id: "env-req",
          title: "Environment Requirements",
          summary: "Use Chrome incognito window, enable clipboard permissions, resolution at least 1920×1080. Three things, 30 seconds to set up.",
          blocks: [
            { type: "h1", text: "Environment Requirements" },
            { type: "h2", text: "Recommended Setup" },
            { type: "ul", items: [
              "<strong>Browser:</strong> Chrome 90+ (incognito window recommended for login)",
              "<strong>Screen Resolution:</strong> Not less than 1920×1080",
              "<strong>Network:</strong> Stable internet connection"
            ]},
            { type: "image", src: "http://47.87.66.98:3000/images/图：Chrome 无痕窗口.png", caption: "Fig: Chrome Incognito Window (Ctrl+Shift+N to open)", alt: "Chrome incognito window screenshot" },
            { type: "h2", text: "Security Recommendations" },
            { type: "ol", items: [
              "Use Chrome incognito window for login to prevent credential residue",
              "Enable clipboard permissions: Chrome address bar left → click lock/settings icon → Site Settings → Clipboard → select \"Allow\". Group control and account login paste functions both depend on this permission.",
              "Close the incognito window after finishing operations"
            ]},
            { type: "image", src: "http://47.87.66.98:3000/images/图：剪贴板权限设置2.png", caption: "Fig: Clipboard Permission Settings (Address bar left → Site Settings → Clipboard → Allow)", alt: "Clipboard permission settings screenshot" },
            { type: "tip", text: "<strong>Why incognito window?</strong> Prevents browser extensions, cookie caches, and other factors from interfering with platform operation. Also prevents cross-contamination of credentials between different operators." }
          ]
        },
        {
          id: "quick-login",
          title: "Login & Accounts",
          summary: "Accounts are created by administrators. Once you have your credentials, log into the Operator Console using a Chrome incognito window. The Admin Console is not part of daily use.",
          blocks: [
            { type: "h1", text: "Login & Accounts" },
            { type: "p", text: "<strong>Contact your administrator for the Operator Console and Admin Console URLs.</strong> These are two independent web pages with different addresses." },
            { type: "h2", text: "Getting an Account" },
            { type: "p", text: "Platform accounts are created and assigned by administrators. When contacting your admin, specify: required <strong>feature scope</strong>, <strong>container count</strong>, and <strong>network environment requirements</strong>." },
            { type: "h2", text: "Logging into the Operator Console" },
            { type: "p", text: "Open the Operator Console URL in a Chrome incognito window and log in with the credentials assigned by your administrator." },
            { type: "image", src: "http://47.87.66.98:3000/images/图：运营前台登录页面.png", caption: "Fig: Operator Console Login Page", alt: "Login page screenshot" },
            { type: "h2", text: "Entry Point Quick Reference" },
            { type: "table", headers: ["Entry Point", "User"],
              rows: [
                ["Operator Console", "Daily operators — the vast majority of tasks are done here"],
                ["Admin Console", "Administrator / Senior Operator — configure assets and system"]
              ]
            },
            { type: "tip", text: "<strong>Account-related:</strong> To add new operator accounts, reset devices, or expand container capacity, contact your administrator or platform representative. These operations are configured during deployment and don't need attention during daily operations." }

        {
          id: "quick-start",
          title: "Day One Guide",
          summary: "On your first day with an account, follow this timeline — each step has a clear completion indicator. 30 minutes to get the basic workflow running. Each step has troubleshooting entry points if you get stuck.",
          blocks: [
            { type: "h1", text: "Day One Guide" },
            { type: "p", text: "You don't need to read this entire manual on day one. Pick your role and follow the timeline below — each step has a <strong>clear indicator</strong> telling you \"this step is done.\" If stuck, check the troubleshooting entry under each step. In 30 minutes, a warming task will be running and you'll know what to check tomorrow — that's enough." },
            { type: "h2", text: "🟢 Operator Path (~30 minutes)" },
            { type: "p", text: "Prerequisite: Your administrator has already created your platform account, assigned container devices and social accounts. Open a Chrome incognito window and let's begin." },
            { type: "h3", text: "⏱ Minutes 0–5: Log In, See Your Devices" },
            { type: "table", headers: ["What to Do", "How", "✅ Done When"],
              rows: [
                ["Open Chrome incognito", "Ctrl+Shift+N → enter Operator Console URL", "See the login page"],
                ["Log into the platform", "Enter admin-assigned credentials", "Enter the Operator Console home page"],
                ["Enter Screen Mirroring", "Left nav → Device Management → Screen Mirroring Matrix", "See a row of container cards (small rectangles), each with green/gray status indicator in the top-left"],
                ["Open a container", "Click any container thumbnail with green status", "See real-time phone screen — Android desktop or app interface visible"]
              ]
            },
            { type: "tip", text: "<strong>Stuck?</strong> Can't see container cards → contact admin to confirm device assignment. Screen black / \"connecting\" → see 「<a href=\"#常见问题\">Screen Mirroring → Common Issues</a>」 five-step troubleshooting. Login failed → check credentials are correct and Chrome is in incognito mode." },
            { type: "h3", text: "⏱ Minutes 5–15: Register & Log Into Your First Social Account" },
            { type: "table", headers: ["What to Do", "How", "✅ Done When"],
              rows: [
                ["Enter Social Media Center", "Left nav → Social Media Center → select target platform (e.g., TikTok)", "See the platform's account list page"],
                ["Check if account is already registered", "Check if your social account appears in the list", "Seeing account info = admin already registered it, skip registration"],
                ["(If needed) Import account", "Download template → fill in account info → batch import", "Account appears in the list"],
                ["Bind container device", "Select account → click \"Bind Device\" → choose a container", "Account row shows the bound device name"],
                ["Manually log into social account", "Open bound container screen mirror → log in within the app. Click the input field to auto-paste credentials", "App home page displays normally — can see recommended content feed"]
              ]
            },
            { type: "warn", text: "<strong>⚠️ First login MUST be done manually.</strong> Do not attempt scripted batch login — this is the highest-risk moment for platform security checks. When logging in, click the input field to auto-paste credentials (no need to type manually), but the login action itself must be completed manually by you. See 「<a href=\"#social-account\">Account Management</a>」 for details.<br><br><strong>⚠️ New accounts have a 3-day quiet period.</strong> Do NOT change avatar, nickname, bio, password, or bind phone/email. Do NOT post, DM, or mass comment. These first three days are for warming only — let the account behave like a normal person first." },
            { type: "h3", text: "⏱ Minutes 15–25: Create Your First Warming Task" },
            { type: "table", headers: ["What to Do", "How", "✅ Done When"],
              rows: [
                ["Open Schedule Board", "Social Media Center → check the account you just logged in → click \"Schedule\"", "See the calendar grid"],
                ["Create new warming task", "<strong>Right-click</strong> on today's time slot → select \"Account Warming\"", "Warming parameter config window appears"],
                ["Configure warming params", "Duration: 900 (15 min) → Likes: 5–35 → Bookmarks: 5–20 → Search: 50–80 → enter a few search keywords relevant to the account's niche", "Parameters are filled in"],
                ["Save and confirm execution", "Click save → go to \"Task Management\" to check", "Task appears in Task Management with status \"Running\" or \"Completed\""]
              ]
            },
            { type: "tip", text: "<strong>Stuck?</strong> Right-click on calendar grid does nothing → refresh page and retry. Not sure what warming parameters to use → use the defaults, see 「<a href=\"#social-scripts\">Task Capabilities</a>」 parameter reference table. After saving, can't see the task in Task Management → check the correct account is selected and execution time hasn't already passed." },
            { type: "h3", text: "⏱ Minutes 25–30: Confirm Everything Is Running + Know What to Check Tomorrow" },
            { type: "table", headers: ["What to Do", "How", "✅ Done When"],
              rows: [
                ["Check task execution status", "Device Management → Task Management → check the warming task you just created", "Task status is \"Completed\" or \"Running\", with execution screenshots"],
                ["Know what to check tomorrow", "Remember two places: ① Task Management — check if warming has any failures; ② Data Center — see if accounts have data", "Mindset ready: tomorrow login → quick scan of Task Management → check Data Center"]
              ]
            },
            { type: "tip", text: "<strong>Day one ends here 🎉.</strong> Warming tasks are running, accounts are building authority. Tomorrow after login: ① confirm warming is running normally in Task Management; ② check Data Center for account data changes. Subsequent posting, batch operations, plan management — flip to the relevant chapter when you need it." },
            { type: "h2", text: "🔵 Administrator Path (~half day)" },
            { type: "p", text: "Prerequisite: Hardware deployment has been completed by the platform team, and you can log into the Admin Console. If the platform team already configured your assets during deployment, skip directly to the Operator Path." },
            { type: "h3", text: "⏱ Step 1: Create Operator Accounts and Assign Resources (15 min)" },
            { type: "table", headers: ["What to Do", "How", "✅ Done When"],
              rows: [
                ["Create platform accounts in SSO", "Create users via the platform SSO single sign-on system and set role permissions", "New users can log into the Operator Console"],
                ["Assign specific resources in Admin Console", "Admin Console → System Management → Social Account Management → assign specific social accounts, network proxies, and cloud phones to this user", "User can see assigned devices, accounts, and data after login — unassigned resources are invisible"]
              ]
            },
            { type: "h3", text: "⏱ Step 2: Import Assets (30–60 min)" },
            { type: "table", headers: ["What to Do", "How", "✅ Done When"],
              rows: [
                ["Import social accounts", "Asset Management → Account Pool → download template → batch import", "Accounts appear in the account pool list"],
                ["Import network proxies", "Asset Management → Proxy Pool → input proxy info (SOCKS5/VMess/HTTP)", "Proxies appear in list with network check passed"],
                ["Register container devices", "Asset Management → Container Pool → batch import containers", "Containers appear in pool; can view bindings in Association Center"]
              ]
            },
            { type: "h3", text: "⏱ Step 3: Verify Association Relationships (10 min)" },
            { type: "table", headers: ["What to Do", "How", "✅ Done When"],
              rows: [
                ["Global binding audit", "Association Center → verify account→proxy→device bindings are correct one by one", "Every account has a corresponding device and proxy, no gaps or conflicts"],
                ["Spot-check screen mirroring", "Log in as an operator → Screen Mirroring Matrix → randomly open a few containers", "Screen displays normally, network is connected"]
              ]
            },
            { type: "tip", text: "<strong>After setup, daily maintenance is just minor adjustments.</strong> Adding new accounts, swapping proxies, adjusting permissions — a few minutes each time. If the platform team already completed the above configuration during deployment, start directly from the Operator Path. See the 「<a href=\"#admin-overview\">Admin Console</a>」 chapter for details." }
          ]
        },
        {
          id: "team-guide",
          title: "Team Collaboration Guide",
          summary: "How to divide work in a multi-person team, avoid device conflicts, and keep the team running smoothly — a practical guide for admins and operators each doing their part.",
          blocks: [
            { type: "h1", text: "Team Collaboration Guide" },
            { type: "p", text: "The platform is a <strong>multi-player collaboration platform</strong> — admins configure assets, operators execute tasks. Everyone doing their part is the key to efficiency. The following guidelines come from actual customer team operational experience — we recommend adopting them." },

            { type: "h2", text: "Three Roles, Each with Clear Ownership" },
            { type: "table", headers: ["Role", "Who", "Owns What", "Frequency"],
              rows: [
                ["<strong>Administrator</strong>", "Team lead / Tech lead", "Asset management (account/proxy/container input and assignment), system config, permission assignment, risk emergency response", "Low — initial batch setup, daily minor tweaks (add accounts, swap proxies), every few days"],
                ["<strong>Senior Operator</strong>", "Ops lead / Strategy owner", "Plan template design, strategy formulation, data analysis and strategy adjustment, grouping planning", "Medium — batch work during design phase, freeze after validation; data analysis glance daily"],
                ["<strong>Daily Operator</strong>", "Ops execution staff", "Screen mirroring control, content publishing, warming monitoring, task troubleshooting, daily inspection", "High — first stop after daily login: Screen Mirroring → Task Management → Data Center"]
              ]
            },
            { type: "tip", text: "<strong>One-line division:</strong> Admin manages \"where stuff is\", Senior Operator manages \"how it runs\", Daily Operator manages \"how it's running\". The clearer the boundaries between these three layers, the smoother the team." },

            { type: "h2", text: "Four Principles of Team Collaboration" },
            { type: "ol", items: [
              "<strong>Clear device ownership:</strong> Agree within the team who is responsible for which containers and document it. We recommend dividing device groups by customer, project, or platform, and creating corresponding device groups in Phone Management. One operator should not manage more than 30 containers simultaneously — if exceeding, consider adding staff.",
              "<strong>No double-opening the same container:</strong> A cloud phone can only be controlled by one person at a time. If a second person tries to open an already-occupied container, the screen mirror will show \"Occupied by XX\", and forcing takeover will kick out the first person's session. If you find screen mirror black, first check if a colleague opened it — this is the #1 collaboration friction point.",
              "<strong>Notify before changing strategies:</strong> Modifying a plan template affects ALL associated devices. If you change warming parameters or push a new post template — the execution behavior of all associated devices changes simultaneously. Announce in the group chat before changing strategies to avoid colleagues being confused by sudden data anomalies.",
              "<strong>When an account has issues, first investigate cascading impact:</strong> If one account gets flagged by platform security, other accounts using the same proxy may also be affected. After discovering a problem account: ① Reverse-query in Association Center to find other accounts sharing the same proxy; ② Notify colleagues responsible for those accounts; ③ Jointly assess whether proxy swap or device reset is needed."
            ]},

            { type: "h2", text: "Recommended Daily Workflows" },
            { type: "h3", text: "Operator · Daily Checklist (5 minutes)" },
            { type: "ol", items: [
              "<strong>Quick scan of Task Management:</strong> Any red failure markers? If yes, click to see failure reason, troubleshoot using the four-step process in 「<a href=\"#device-task-mgr\">Task Management → When a Task Fails</a>」. Single device failure → first check the screen mirror view. Multiple devices failing simultaneously → check the proxy.",
              "<strong>Spot-check screenshots:</strong> Expand a few completed tasks in Task Management and check execution screenshots — is posted content correct? Is the warming screen normal? Check 3–5, not all of them.",
              "<strong>Quick glance at Data Center:</strong> Any account data anomalies (sudden drop, persistent single/double digits)? Flag anomalies and sync with admin to decide whether device reset and account swap is needed.",
              "<strong>Plan execution confirmation:</strong> If there are long-term recurring plans, confirm plan status is normal and associated devices are all online. When new devices need to join an existing plan, associate devices in Plan Management and enable."
            ]},
            { type: "h3", text: "Administrator · Daily Rhythm" },
            { type: "ul", items: [
              "<strong>Routine (every few days):</strong> Add new accounts → batch import into Account Pool → establish account→proxy→device bindings in Association Center → assign to operators in System Management. Replace expired proxies: follow the \"disable→unbind→bind→enable\" sequence.",
              "<strong>Weekly (~30 min):</strong> Full proxy pool health check — cull dead proxies, add new ones. Container pool health check — restart offline devices, clean up long-idle containers.",
              "<strong>Receiving operator feedback:</strong> Operator reports account flagged by platform → reverse-locate affected devices and accounts in Association Center → reset device → one-click device refresh → switch to new account → reassign."
            ]},
            { type: "warn", text: "<strong>⚠️ Most easily overlooked:</strong> When an administrator takes leave or leaves the company, proper handover is essential — asset input checklist (which accounts/proxies/containers belong to which customer), system admin credentials, device grouping logic explanation. The consequence of no handover: colleagues staring at an empty Screen Mirroring Matrix with no idea where anything went." },

            { type: "h2", text: "Common Collaboration Issues" },
            { type: "table", headers: ["What You're Seeing", "Cause", "Solution"],
              rows: [
                ["Screen mirror black, worked yesterday", "Likely a colleague opened the same container in another tab", "Ask in group chat who's using this device; or check Task Management to see if the device is executing a task (orange = busy)"],
                ["Changed plan template, now colleagues say post content changed", "Plan template changes apply to all associated devices simultaneously", "Notify in group before changing strategies; rollback: restore from history version or manually revert to original parameters"],
                ["Assigned account to operator but they can't see it", "Account assignment requires page refresh, and confirm correct platform sub-page is selected", "Have operator refresh page → confirm they're on the correct platform sub-page (e.g., TikTok) → admin goes to Association Center to confirm \"Activate\" has been clicked"],
                ["Multiple people need batch operations simultaneously, interfering with each other", "Batch operations and Schedule Board are account-level — one account can only have one editor at a time", "Agree that each operator manages different account groups with no overlap; coordinate in group chat for urgent cases"]
              ]
            }
          ]
        },
        {
          id: "pain-points",
          title: "Having Issues? Find by Symptom",
          summary: "Don't flip through the table of contents. Screen black, task failed, account anomaly — find solutions directly by the problem you're experiencing.",
          blocks: [
            { type: "h1", text: "Having Issues? Find by Symptom" },
            { type: "p", text: "This manual is organized by feature module — great for systematic learning, poor for emergency troubleshooting. This page is the reverse: <strong>find answers by the symptom you're experiencing</strong>. Ctrl+F search works too, but the categories below are more systematic." },
            { type: "tip", text: "<strong>🔗 Quick jump:</strong><a href=\"#设备-投屏问题\">🖥️ Device & Screen</a> · <a href=\"#任务执行问题\">📋 Task Execution</a> · <a href=\"#账号问题\">👤 Account</a> · <a href=\"#内容-发布问题\">📝 Content & Publishing</a> · <a href=\"#数据-监控问题\">📊 Data & Monitoring</a> · <a href=\"#网络-代理问题\">🔧 Network & Proxy</a>" },
            { type: "h2", text: "🖥️ Device & Screen Issues" },
            { type: "table", headers: ["What You're Seeing", "Most Likely Cause", "Solution"],
              rows: [
                ["Screen black / stuck on \"Connecting\"", "Same container opened in another tab; container offline; browser incompatible", "<a href=\"#常见问题\">Screen Mirroring → Common Issues</a> (five-step troubleshooting, 90% resolved in first two steps)"],
                ["Group control not syncing / some devices unresponsive", "Clipboard permission not enabled; devices not on the same page; individual device anomaly", "<a href=\"#群控不同步-部分设备没反应\">Screen Mirroring → Group Control Failure</a> (check clipboard permission first)"],
                ["Container shows gray (offline)", "Container powered off or network disconnected", "Contact admin to restart container; check proxy status in \"Network Config\""],
                ["Container shows orange (busy)", "Container is executing a task", "Wait for current task to complete before operating; check execution progress in \"Task Management\""],
                ["File upload error \"container cannot find disk\"", "Container process anomaly", "Restart container to recover; platform's built-in inspection routine auto-handles most such issues"],
                ["App installation failed", "APK file incompatible or container storage insufficient", "Check APK compatibility with Android version; clear container storage and retry"]
              ]
            },
            { type: "h2", text: "📋 Task Execution Issues" },
            { type: "table", headers: ["What You're Seeing", "Most Likely Cause", "Solution"],
              rows: [
                ["Task shows \"Failed\" or red marker", "App popup/update prompt blocking; network timeout; account logged out; content rejected", "<a href=\"#遇到任务失败\">Task Management → What to Do When a Task Fails</a> (four-step troubleshooting flow)"],
                ["Same task type failing across multiple devices simultaneously", "Proxy provider issue; platform security upgrade", "Go to Admin Console → Association Center to query shared proxies → <a href=\"#device-network\">Network Config → Bulk Proxy Troubleshooting</a>"],
                ["Same capability repeatedly failing", "Capability needs update", "Contact platform support to check if adaptation update is needed"],
                ["Task saved but doesn't appear in schedule", "Repeat type in Plan Management set to \"Once\"", "<a href=\"#plan-mgr\">Plan Management</a> — change repeat type to \"Daily\" or \"Weekly\""],

        {
          id: "device-task-mgr",
          title: "Task Management · Execution & Troubleshooting",
          summary: "Your first stop after daily login — view all task execution status from a device perspective. Retry failures, edit schedules, download output documents.",
          blocks: [
            { type: "h1", text: "Task Management — Global Task Query & Troubleshooting" },
            { type: "p", text: "Task Management is one of the <strong>three most frequently used modules</strong> (alongside Screen Mirroring Matrix and Social Media Center). It provides task completion query and confirmation from a <strong>device operation perspective</strong>. Social Media Center also has a task history page viewed from an <strong>account perspective</strong> — different viewpoints, same underlying data. During task execution, the platform's built-in AI auto-diagnoses and repairs most mid-execution anomalies without manual intervention; only cases the AI cannot self-heal are marked as failed — handle using the troubleshooting flow in this section." },
            { type: "tip", text: "<strong>📋 In this section:</strong><a href=\"#界面与功能\">Interface & Features</a> · <a href=\"#任务详情与二次操作\">Details & Secondary Operations</a> · <a href=\"#遇到任务失败\">When a Task Fails</a>" },
            { type: "h2", text: "Interface & Features" },
            { type: "p", text: "Users can quickly locate their tasks using filter conditions (time range, task type, device, execution status). Each task record row shows execution status at a glance." },
            { type: "image", src: "http://47.87.66.98:3000/images/任务管理功能概览.png", caption: "Fig: Task Management Feature Overview (numbered annotations explained below)", alt: "Task management interface screenshot" },
            { type: "ol", items: [
              "<strong>① Export Task Records:</strong> Check target task records → click export button to download task data as a file for review and archival.",
              "<strong>② Expand Task Details:</strong> The collapse button on the left of each task — expand to see detailed information: execution time, status, screenshots, output documents, etc.",
              "<strong>③ Re-execute:</strong> If a task failed, click \"Execute Now\" to re-run without reconfiguring task parameters."
            ]},
            { type: "tip", text: "<strong>Daily recommendation:</strong> Spend 5 minutes after daily login scanning Task Management — confirm no red failure markers, spot-check a few screenshots for content quality. Building this habit prevents small issues from becoming major incidents." },
            { type: "h2", text: "Task Details & Secondary Operations" },
            { type: "p", text: "After expanding a task record, you can view detailed execution information and perform secondary operations. This is especially important when a task fails and misses its execution window — you'll need to reschedule." },
            { type: "image", src: "http://47.87.66.98:3000/images/任务运行记录及二次操作.png", caption: "Fig: Task Detail Expansion & Secondary Operations (numbered annotations explained below)", alt: "Task details and operations screenshot" },
            { type: "ol", items: [
              "<strong>④ Edit Schedule:</strong> When a task fails and misses its execution window, click \"Edit Schedule\" to jump directly to the Schedule Board and modify the task — no extra navigation or searching needed.",
              "<strong>⑤ Task Screenshots & Documents:</strong> After expanding a task record you'll see:<br>· <strong>Task Images:</strong> Screenshots at task completion, screenshots of anomalies encountered, and other annotated screenshots<br>· <strong>Task Documents:</strong> Output-type tasks (such as username collection, viral post records, etc.) will provide Excel links here — click to download"
            ]},
            { type: "h2", text: "When a Task Fails" },
            { type: "p", text: "When a task shows \"Failed\", don't immediately click retry — investigate the cause first, otherwise it will likely fail again:" },
            { type: "ol", items: [
              "<strong>View failure details:</strong> Expand the task record and check the error log and execution screenshots. The log tells you exactly where it got stuck — app popup, network timeout, account logged out, content rejected.",
              "<strong>Locate and fix:</strong> App popup → open screen mirror and manually dismiss, then retry; Network timeout → check proxy status; Account logged out → manually re-login then retry; Content rejected → swap assets.",
              "<strong>Bulk investigation:</strong> When one task fails, check other devices' same-type tasks — it could be a systemic issue like proxy provider failure or platform security upgrade.",
              "<strong>Adjust schedule:</strong> If the execution window has passed, click \"Edit Schedule\" to jump to the Schedule Board and reschedule."

            { type: "p", text: "When a task fails mid-execution, AI auto-diagnoses the issue and attempts to repair and complete it. In the vast majority of cases, users won't even perceive the anomaly. Only in special cases where AI cannot self-heal will the task be marked as failed — at which point, follow the troubleshooting flow above." },
            { type: "tip", text: "<strong>Rule of thumb:</strong> Single device failure = check the screen mirror view and manually investigate. Multiple devices failing simultaneously = check network proxy or platform security. Same capability repeatedly failing = contact platform support to check if an update is needed." }
          ]

        {
          id: "device-network",
          title: "Network Configuration",
          summary: "View proxy status for your devices and test connectivity. For daily use this is read-only — bulk management and input are in the Admin Console Proxy Pool.",
          blocks: [
            { type: "h1", text: "Network Configuration — Proxy Viewing & Testing" },
            { type: "p", text: "Each cloud phone is bound to an independent network proxy IP, ensuring IP isolation between different accounts. The Network Config page allows operators to <strong>view assigned proxies, test connectivity, and perform emergency temporary proxy input</strong>. Full proxy batch management is in <a href=\"#admin-assets\">Admin Console → Proxy Pool</a>." },
            { type: "tip", text: "<strong>📋 In this section:</strong><a href=\"#界面与操作\">Interface & Operations</a> · <a href=\"#代理使用规则\">Proxy Rules</a> · <a href=\"#看不到代理信息\">Can't See Proxy?</a>" },
            { type: "h2", text: "Interface & Operations" },
            { type: "image", src: "http://47.87.66.98:3000/images/网络配置.png", caption: "Fig: Network Config Interface (numbered annotations explained below)", alt: "Network config interface screenshot" },
            { type: "ol", items: [
              "<strong>① Add Proxy:</strong> Daily proxies are centrally input by admins in the Admin Console. For emergency temporary input, click \"Add\". Supports three protocols: Socks5, Vmess, HTTP. For Socks5, the link format is <code>IP:Port:Username:Password</code>.",
              "<strong>② Network Test:</strong> Check target devices → click \"Network Test\", system auto-runs detection. If it can open web pages normally and the queried region matches the input region, the network is OK.<br><strong>⚠️ Proxy cleanliness is critical:</strong> Most account security flags originate from unclean networks. <strong>Data center IPs or broadcast IPs CANNOT be used for social media operations — you must use static residential IPs.</strong>",
              "<strong>③ Bind Device:</strong> New proxies need to click \"Bind\" first to associate the proxy with the target device. After binding, click ⑤ \"Enable\" for the proxy to actually take effect. Run a network test after binding to confirm it's working. One device can only bind one proxy.",
              "<strong>④ Association Relationship:</strong> One network proxy can be associated with multiple cloud phones, but one cloud phone cannot be associated with multiple proxies. In extreme cases, one proxy should not exceed 5 devices.",
              "<strong>⑤ Enable:</strong> Bound proxies are not active by default — must click Enable for the proxy to connect with the device.",
              "<strong>⑥ Disable:</strong> Active proxies will show a \"Disable\" button. Clicking it disconnects the proxy from the cloud phone — the device goes offline.",
              "<strong>⑦ Edit:</strong> After proxy renewal, you can adjust parameters like validity period here."
            ]},
            { type: "h2", text: "Proxy Usage Rules" },
            { type: "ul", items: [
              "<strong>One device, one account, one proxy:</strong> Best practice is one social account per device, bound to one static residential IP. Device, account, and proxy should be long-term bound — don't change them casually. Frequent proxy changes are easily flagged by platform security.",
              "<strong>Proxy sharing limit:</strong> One proxy can be associated with multiple devices, but in extreme cases should not exceed 5 — too many sharing will be identified as anomalous by the platform.",
              "<strong>Proxy swap sequence:</strong> Must first \"Disable\" → then \"Unbind\" → re-bind new proxy → \"Enable\" → network test. Direct unbinding will briefly expose the device's real IP."
            ]},
            { type: "h2", text: "Can't See Proxy Info?" },
            { type: "p", text: "Admins can control whether proxy information is visible to users in the Admin Console. If you can't see proxy details on the Network Config page but device networking is still working — it means the admin hasn't opened proxy info visibility for you. Contact your admin to adjust permissions if you need to see it." }
          ]
        },

        {
          id: "social-account",
          title: "Account Management",
          summary: "Import social accounts into the platform → bind to cloud phone → manual login → group management. If admin has already registered them, start from binding.",
          blocks: [
            { type: "h1", text: "Account Management — Binding, Login & Grouping" },
            { type: "p", text: "Social Media Center is organized by <strong>social platform dimension</strong>, with each platform having its own sub-page (TikTok, Xiaohongshu, etc.). The Operator Console's account management allows operators to perform daily operations on <strong>already-assigned accounts</strong>. Unified account input and permission assignment should be done in the Admin Console's Account Pool." },
            { type: "tip", text: "<strong>📋 In this section:</strong><a href=\"#界面与操作\">Interface & Operations</a> · <a href=\"#绑定与登录\">Binding & Login</a> · <a href=\"#账号分组与设备分组关联\">Group Association</a> · <a href=\"#账号更换设备\">Switching Devices</a> · <a href=\"#编辑与风控标注\">Risk Flagging</a>" },
            { type: "h2", text: "Interface & Operations" },
            { type: "image", src: "http://47.87.66.98:3000/images/社媒中心.png", caption: "Fig: Social Media Center Account Management Interface (numbered annotations explained below)", alt: "Social media center interface screenshot" },
            { type: "ol", items: [
              "<strong>① Register Account:</strong> Click \"Add\" to register a new account. The registered account must match the current social platform (e.g., register TikTok accounts on the TikTok sub-page). For batch registration, contact admin to use the Admin Console — the Operator Console is only for temporary individual registration.",
              "<strong>② Bind Device:</strong> A social account must be bound to a device before it can run tasks. After binding, click the ⑥ Device IP on the left to directly open that device for manual login. Account login is a highly sensitive operation — always do it manually.",
              "<strong>③ Schedule:</strong> After completing account registration and device binding, check target accounts → click \"Schedule\" → the Schedule Board appears for task orchestration.",
              "<strong>④ Plan Management:</strong> Ad-hoc tasks use Schedule; long-term recurring schedules should be configured in Plan Management. Click the \"Plan Management\" button on the Social Media Center page to view the enablement status of plans associated with this account.",
              "<strong>⑤ Task History:</strong> Select target accounts → click \"Task History\" → query this account's platform-related task execution records and status (account-centric task view, complementary to Task Management's device-centric view).",
              "<strong>⑥ Device IP:</strong> Click the device IP to directly open the corresponding cloud phone for manual operation.",
              "<strong>⑦ Edit & Flag:</strong> Click edit to annotate account status and risk conditions.<br><strong>⚠️ Cascading risk alert:</strong> If you flag an account with a risk level, other accounts using the same network proxy or associated with the same device will receive cascading risk alerts — one account has issues, the system reminds you to check other accounts sharing its resources."
            ]},
            { type: "h2", text: "Binding & Login" },
            { type: "p", text: "<strong>A social account MUST be bound to a cloud phone container before it can execute tasks.</strong> If an account isn't associated with a device, the system doesn't know which device to use. Select account in the list → click \"Bind Device\" → choose a target device from your assigned containers. After binding, click the device IP to open screen mirroring and manually log in within the app." },
            { type: "tip", text: "<strong>💡 One-click paste:</strong> Pre-registered account credentials don't need to be typed manually — <strong>single-click</strong> in the login field and the system auto-pastes (username first, then password). If 2FA info was provided during registration, simply refresh the top-left verification code input." },
            { type: "warn", text: "<strong>Note:</strong> Login is a high-density platform security checkpoint — <strong>first login MUST be done manually by a human</strong>, cannot be batch automated. For newly registered accounts, don't set the birth year below 18 — the account will be flagged as a minor-controlled account." },
            { type: "h2", text: "Account Grouping & Device Group Association" },
            { type: "p", text: "Device grouping and account grouping are two independent systems — device groups are created in Phone Management, account groups within Social Media Center, and <strong>they don't auto-associate</strong>. To make a device group filter show accounts: ensure no device group is selected → find target accounts → manually associate them with the device group → next time you select that group, they'll appear." },
            { type: "tip", text: "<strong>💡 Simple memory aid:</strong> Selected a device group but account list is empty? → Clear group → find account → manually associate → next time it's there." },
            { type: "table", headers: ["Grouping Dimension", "Location", "Purpose"],
              rows: [
                ["Global Grouping", "Admin Console → System Management → Group Management", "View all grouping status; currently an independent form"],
                ["Device Grouping", "Operator Console → Phone Management", "Group by physical container; requires manual account association"],
                ["Account Grouping", "Social Media Center → within specific platform", "Pure account-dimension grouping, unrelated to device grouping"]
              ]
            },
            { type: "h2", text: "Switching Accounts to a Different Device" },
            { type: "p", text: "To migrate a social account from one container to another: unbind old device → (optional) reset old container → one-click device refresh → confirm new container has completed one-click refresh → bind new device → manual login." },
            { type: "warn", text: "<strong>⚠️ Don't switch devices within 3 days of new account login</strong>, otherwise high probability of triggering platform security." },
            { type: "h2", text: "Editing & Risk Flagging" },
            { type: "p", text: "Click the edit button next to an account to annotate account status and risk conditions. If an account is flagged with a risk anomaly, other accounts using the <strong>same network proxy</strong> or <strong>associated with the same device</strong> will trigger cascading alerts — reminding you to check if other accounts sharing resources are also affected. This is a critical risk management tool in matrix operations: one account has issues, the entire network of associated accounts gets alerted." },
            { type: "tip", text: "<strong>Account Registration & Management:</strong> For batch account import, unified management, and permission assignment, go to <a href=\"#admin-assets\">Admin Console → Asset Management → Account Pool</a>." }
          ]
        },
        {
          id: "social-schedule",
          title: "Schedule",
          summary: "Right-click on a calendar grid cell to create a task — warming, posting, commenting, DMs. Flexible and precise, ideal for ad-hoc and small-batch account operations.",
          blocks: [
            { type: "h1", text: "Schedule" },
            { type: "p", text: "The Schedule Board is the core feature of Social Media Center — it displays all tasks for multiple accounts in a <strong>calendar format</strong> at a glance. Executed, pending, failed — all task statuses are visible on the Schedule Board without jumping between pages." },
            { type: "h2", text: "Schedule Board Overview" },
            { type: "p", text: "In Social Media Center, select target platform → check accounts → click \"Schedule\" to enter the Schedule Board. Calendar cells display all configured tasks for each account on a timeline, supporting week view and day view toggle." },
            { type: "h3", text: "Timezone Setting" },
            { type: "p", text: "Before configuring tasks, <strong>always confirm the timezone is set to the target region's timezone</strong> (e.g., operating Southeast Asian accounts requires switching to the corresponding timezone). Tasks created on the calendar execute at the target timezone's local time. If the target timezone differs from China time (e.g., UTC+7 is 1 hour behind China's UTC+8), the system will calculate the offset and trigger at the target timezone's time point." },
            { type: "h3", text: "Expand Time" },
            { type: "p", text: "The calendar defaults to collapsing the <strong>0:00–8:00</strong> off-peak period. To schedule tasks during this window, click the \"Expand Time\" button to show the full 24-hour view." },
            { type: "image", src: "http://47.87.66.98:3000/images/schedule-settings-entry.png", caption: "Fig: Check devices → click \"Schedule\"", alt: "Enter schedule from device management" },
            { type: "image", src: "http://47.87.66.98:3000/images/schedule-dashboard-overview.png", caption: "Fig: Schedule Board Overview — showing multi-account weekly warming, posting, and interaction task layout", alt: "Schedule board interface" },
            { type: "video", src: "http://47.87.66.98:3000/images/schedule-settings-demo.mp4", caption: "Fig: Complete Schedule Demo — right-click new task → select type → configure params → save → view schedule layout", alt: "Schedule demo video" },
            { type: "h2", text: "Creating a Schedule" },
            { type: "p", text: "<strong>Right-click</strong> on a target time slot → select task type → configure parameters → save. For posting, assets can be selected from the <strong>Content Center Asset Library</strong> or <strong>uploaded directly from local files</strong>. Supported task types are listed in the 「<a href=\"#social-scripts\">Task Capabilities</a>」 chapter." },
            { type: "image", src: "http://47.87.66.98:3000/images/right-click-new-task.png", caption: "Fig: Right-click to create new task", alt: "Schedule creation" },
            { type: "image", src: "http://47.87.66.98:3000/images/task-params-config.png", caption: "Fig: Task parameter configuration", alt: "Task configuration" },
            { type: "h2", text: "Conflict Staging Area" },
            { type: "p", text: "If an account has multiple tasks set on the Schedule Board that overlap in time with recurring tasks from <strong>Plan Management</strong>, the conflicting tasks are automatically moved to the \"Conflict Staging Area.\" Users can manually <strong>drag</strong> conflict task blocks to target times to resolve conflicts, after which tasks execute normally." },
            { type: "h2", text: "Schedule Staging Area" },
            { type: "p", text: "If an account has tasks established on the Schedule Board but you want to temporarily pause them and save for later — drag the task to the <strong>\"Schedule Staging Area\"</strong>. The task retains all previously configured parameters (type, content, execution settings, etc.) and can be dragged back to a target time when needed — no reconfiguration required." },
            { type: "image", src: "http://47.87.66.98:3000/images/schedule-conflict-and-staging.png", caption: "Fig: Conflict Staging Area & Schedule Staging Area — left: conflict tasks awaiting drag adjustment; right: staged tasks retaining parameters for later use", alt: "Conflict and staging areas" },
            { type: "tip", text: "<strong>Natural container limitation:</strong> A container can install multiple social apps simultaneously, but just like a real phone — <strong>it can only execute one task at a time</strong>. If two tasks overlap in time, the later task automatically queues. Leave reasonable intervals when configuring schedules." }
          ]
        },
        {
          id: "social-batch",
          title: "Batch Operations · Multi-Account Parallel",
          summary: "Core feature — connect multiple accounts with one task strategy, each running independently with subtle variations. Focus on understanding placeholders and time windows.",
          blocks: [
            { type: "h1", text: "Batch Operations (Core Feature)" },
            { type: "p", text: "Batch Operations is the platform's most frequently used and most important feature — it <strong>connects multiple accounts with one task strategy in parallel</strong>, forming \"unordered high-simulation\" composite execution. Each account runs independently with subtle time and parameter variations. What the platform sees is a group of real people doing similar things at different times, not a batch of machines." },
            { type: "tip", text: "<strong>📋 In this section:</strong><a href=\"#两种参数\">General vs Custom Params</a> · <a href=\"#占位符与素材分配\">Placeholders & Asset Assignment</a> · <a href=\"#时间设定规则\">Time Setting Rules</a> · <a href=\"#social-schedule\">Conflict Staging → Schedule</a>" },
            { type: "h2", text: "Two Parameter Types" },
            { type: "table", headers: ["Parameter Type", "Description", "Example"],
              rows: [
                ["General Parameters", "Settings uniform across all tasks", "Original flag, execution count, execution time window"],
                ["Custom Parameters", "Settings that differ between tasks", "Post title, body text, image assets, hashtags"]
              ]
            },
            { type: "image", src: "http://47.87.66.98:3000/images/batch-params-config.png", caption: "Fig: Batch Operations Parameter Configuration — ① General Parameters ② Custom Parameters", alt: "Batch operations screenshot" },
            { type: "h2", text: "Placeholders & Asset Assignment" },
            { type: "p", text: "A placeholder represents <strong>one piece of content</strong> for a given parameter. Use placeholders to precisely control each post's content." },
            { type: "h3", text: "Scenario A: Precisely Set Images for Each Post" },
            { type: "p", text: "Click the \"+\" on each placeholder to upload images one by one. After confirming, each image is precisely assigned to its corresponding post." },
            { type: "h3", text: "Scenario B: Random Multi-Image Assignment" },
            { type: "p", text: "Hold <code>Alt</code> to multi-select placeholders (or click the column header to select all) → batch add placeholders → click \"+\" to batch import assets. The system auto-distributes assets based on each post's placeholder count." },
            { type: "video", src: "http://47.87.66.98:3000/images/batch-alt-multi-select.mp4", caption: "Fig: Alt-key multi-select placeholder batch operation demo", alt: "Alt multi-select demo" },
            { type: "video", src: "http://47.87.66.98:3000/images/batch-select-all.mp4", caption: "Fig: Select-all + batch operation complete workflow", alt: "Select-all demo" },
            { type: "image", src: "http://47.87.66.98:3000/images/723c376f-3b01-4e34-91cb-4e6b47aa1d51.png", caption: "Fig: Multi-image random assignment", alt: "Batch image assignment" },
            { type: "h2", text: "Time Setting Rules" },
            { type: "p", text: "Task execution time is determined by two parameters — <strong>Execution Window</strong> defines a time range; the system randomly distributes times within it, simulating natural human rhythm. <strong>Execution Time</strong> (higher priority) specifies a precise time point for tasks that need exact timing. The two can be combined: set an execution window covering most tasks, then individually set execution times for specific posts to achieve \"mostly random + a few precise.\" When only execution window is set (no execution time), all tasks are fully randomly distributed within the window." },
            { type: "tip", text: "<strong>Pro tips:</strong> ① Right-click the table header for context menu — add placeholders, adjust column widths, batch set parameters. ② Click column header to select entire column, <strong>Alt + click target rows</strong> to multi-select for batch asset upload. ③ Set \"New Operation = Yes\" to save posts <strong>as drafts</strong> rather than publishing directly — ideal for scenarios requiring human review before going live." }
          ]
        },
        {
          id: "social-scripts",
          title: "Task Capabilities · Reference Manual",
          summary: "Complete reference for all available task capabilities — each capability's purpose, parameters, platform support, and important notes. This is foundational to understanding the platform's automation power.",
          blocks: [
            { type: "h1", text: "Task Capabilities Reference Manual" },
            { type: "p", text: "All of the platform's automated operations are driven by <strong>task capabilities</strong>. Every task type you select in Schedule and Batch Operations is backed by a battle-tested automation capability. Understanding what each capability does and how to tune its parameters is key to unlocking the platform's full value — <strong>this chapter is worth reading in full</strong>." },
            { type: "tip", text: "<strong>📋 Quick Nav:</strong><a href=\"#总览\">Overview</a> · <a href=\"#养号\">Warming</a> · <a href=\"#内容发布\">Content Publishing</a> · <a href=\"#互动\">Interaction</a> · <a href=\"#私信\">DM</a> · <a href=\"#直播\">Livestream</a> · <a href=\"#数据采集\">Data Collection</a> · <a href=\"#搜索\">Search</a> · <a href=\"#账号管理\">Account Mgmt</a> · <a href=\"#进阶参数\">Advanced Params</a> · <a href=\"#参数输入模式\">Input Modes</a>" },
            { type: "h2", text: "Overview" },
            { type: "p", text: "Below are all available task capabilities organized by category. The platform is built on a platform-agnostic architecture (simulating real phones, not relying on platform APIs), so <strong>theoretically all capabilities can cover any social media platform</strong>. Currently adapted platform capabilities are ready to use; unadapted platforms are supported on demand with rapid turnaround — <strong>just submit your requirements; adaptation cycles are measured in weeks</strong>." },
            { type: "table", headers: ["Category", "Capability", "One-Line Description"],
              rows: [

                ["📢 Content", "Publish Video", "Publish video content"],
                ["📢 Content", "Publish Image+Text", "Publish image+text content"],
                ["📢 Content", "Publish Text — Random Template", "Randomly select copy from template library for publishing"],
                ["📢 Content", "Publish Text — Specified Template", "Use a specific template to publish copy"],
                ["📢 Content", "Hide Post", "Hide a published post"],
                ["💬 Interaction", "Basic Interaction Comment", "Post comments on target posts; supports script library and AI dynamic generation"],
                ["💬 Interaction", "Nested Comment", "Nested reply under existing comments; ideal for multi-round interaction storylines"],
                ["✉️ DM", "Batch User DM", "Send DMs to target users; supports message templates and variable substitution"],
                ["🎬 Livestream", "Livestream Interaction", "Matrix accounts enter livestreams to comment and like, boosting heat"],
                ["📊 Collection", "Data Collection", "Auto-fetch logged-in social account data, aggregate to Data Center"],
                ["📊 Collection", "Capture Intent Comments", "Monitor target post comment sections; AI semantic recognition of purchase-intent user comments"],
                ["📊 Collection", "Livestream User Collection", "Continuously collect online user lists entering a livestream"],
                ["📊 Collection", "Group Message Capture", "Capture chat messages within groups"],
                ["🔍 Search", "Article Search", "Locate target posts by keyword or link; post-search actions can trigger interactions"],
                ["👤 Account", "Set Bio & Name", "Batch set social account nickname and bio"],
                ["👤 Account", "Account Setup", "Batch set avatar, nickname, bio, profile link"]
              ]
            },
            { type: "tip", text: "<strong>Platform support notes:</strong> All capabilities theoretically cover any social platform. This manual's capability details use TikTok and Xiaohongshu (RED) as primary examples; Instagram, Facebook, YouTube, Weibo, Douyin, and other adapted platforms' capabilities are configured on demand. Contact platform support to submit requirements for other platforms — adaptation cycles measured in weeks. Once one platform goes live, others can quickly follow." },
            { type: "h2", text: "🌱 Warming" },
            { type: "h3", text: "Precision Warming" },
            { type: "p", text: "<strong>What it does:</strong> AI-driven human-like operations — the system auto-browses content, swipes, likes, and follows. Supports <strong>keyword-driven</strong> operation: during warming, browse content based on specified search keywords — warming accounts while shaping their content tags." },
            { type: "p", text: "<strong>One capability, three warming scopes (users can select and combine in configuration):</strong>" },
            { type: "table", headers: ["Sub-Capability", "Description", "Use Case"],
              rows: [
                ["<strong>Precision Warming</strong>", "Basic browsing, liking, following; shapes account tags through search keywords", "Daily warming, new account incubation"],
                ["<strong>Comment Funnel</strong>", "Auto-comment on high-value posts matching CES threshold (CES = likes×1 + bookmarks×1 + comments×4)", "Leave comments on hot posts to guide follows"],
                ["<strong>Viral Post Collection</strong>", "Auto-identify and record high-interaction posts encountered during browsing", "Competitor research, content strategy analysis"]
              ]
            },
            { type: "p", text: "<strong>Supported platforms:</strong> TikTok ✓ Xiaohongshu (RED) ✓ Other platforms adapted on demand." },
            { type: "p", text: "<strong>Key parameters (all numeric parameters support <a href=\"#参数输入模式\">three input modes</a>):</strong>" },
            { type: "table", headers: ["Parameter", "Recommended Value", "Notes"],
              rows: [
                ["Warming Duration", "Single session ≤1800s, 900s (15 min) recommended", "Simulates reasonable single-session social media usage duration for a real person"],
                ["Like Probability", "Use a range, e.g., 5–35", "Random value picked from range each execution"],
                ["Bookmark Probability", "Use a range, e.g., 5–20", "Bookmarks are heavier than likes; set probability lower"],
                ["Search Probability", "50–80", "Higher values accelerate vertical tag formation"],
                ["Search/Browse Keywords", "Multiple keywords, line-separated, e.g.: beauty tutorial, skincare recs", "Determines what content the account sees — choose keywords relevant to positioning"],
                ["Content Recognition Keywords", "Multiple keywords, line-separated", "AI dwells longer and is more likely to interact with content containing these keywords"],
                ["Warming Time Range", "Follow target region's active hours, e.g., 08:00–23:00", "Don't execute during late-night hours"]
              ]
            },
            { type: "image", src: "http://47.87.66.98:3000/images/nurture-task-params.png", caption: "Fig: Warming Task Parameter Configuration Panel — complete parameters including duration, content direction, search/like/bookmark probabilities", alt: "Warming task config panel" },
            { type: "h3", text: "How to Tell If Warming Is Successful?" },
            { type: "ol", items: [
              "<strong>Content recommendations are highly aligned:</strong> Manual swipe through a few screens — recommended content is highly relevant to target tags",
              "<strong>Multiple feature entries appear on profile:</strong> E.g., Shop, Live entries appearing — account authority has increased",

            { type: "p", text: "Accounts with warming tasks configured <strong>typically achieve vertical tag formation in about 3 days</strong>." },
            { type: "warn", text: "<strong>New account first 3 days quiet period:</strong> Don't change avatar, bio, password, or bind phone/email. Don't do high-frequency posting, DMs, or mass commenting. These first three days are for warming only." },
            { type: "h2", text: "📢 Content Publishing" },
            { type: "h3", text: "TikTok Posting" },
            { type: "p", text: "<strong>What it does:</strong> Publish video or image content. Supports asset library selection or local file upload, scheduled publishing, and draft mode. <strong>Supported platforms:</strong> TikTok ✓" },
            { type: "table", headers: ["Parameter", "Notes", "Recommendation"],
              rows: [
                ["Original Flag", "Mark whether the post is original content", "Original content gets higher weight"],
                ["New Operation", "\"Yes\" = save draft; \"No\" = publish directly", "New accounts: save as draft first, manually review before publishing"],
                ["Title / Hashtags", "Post text content and tags", "Use placeholders in batch ops for per-account different content"],
                ["Images / Videos", "Select from asset library or upload local files", "Use placeholders in batch ops for precise or random assignment"],
                ["Publish Time", "Set via \"Execution Time\" or \"Execution Window\"", "Follow target region's user active hours. 1–3 posts/day, 3+ hours apart"]
              ]
            },
            { type: "h3", text: "Xiaohongshu (RED) Publishing" },
            { type: "p", text: "Xiaohongshu content publishing is split into four independent capabilities with a consistent parameter system. All supported on Xiaohongshu ✓:" },
            { type: "table", headers: ["Capability", "Description"],
              rows: [
                ["<strong>Publish Video</strong>", "Publish video content"],
                ["<strong>Publish Image+Text</strong>", "Publish image+text content (images + text) — Xiaohongshu's <strong>core content format</strong>"],
                ["<strong>Publish Text — Random Template</strong>", "Randomly select copy from preset template library — ideal for diverse content scenarios"],
                ["<strong>Publish Text — Specified Template</strong>", "Use a specific template to publish — ideal for precisely controlled content scenarios"]
              ]
            },
            { type: "p", text: "<strong>Key parameters:</strong> Same as TikTok posting — original flag, draft mode, title/hashtags, asset selection, publish time." },
            { type: "h3", text: "Hide Post (Xiaohongshu)" },
            { type: "p", text: "<strong>What it does:</strong> Set a published post to hidden status — the post is no longer publicly visible but data is preserved and recoverable. <strong>Supported platforms:</strong> Xiaohongshu (RED) ✓" },
            { type: "warn", text: "<strong>Note:</strong> Hiding is recoverable; deletion is irreversible. Platforms monitor hiding/deletion patterns — don't execute in high volume or frequency." },
            { type: "tip", text: "<strong>Posting frequency limits:</strong> One account max 5 posts/day, recommended 1–3. Multiple posts should be 3+ hours apart. DMs have daily caps per account (varies by platform)." },
            { type: "h2", text: "💬 Interaction" },
            { type: "p", text: "Interaction capabilities let matrix accounts leave comments on target posts to guide real users to follow. Both capabilities support <strong>TikTok ✓ Xiaohongshu (RED) ✓</strong>, other platforms adapted on demand." },
            { type: "table", headers: ["Capability", "What It Does", "Key Difference"],
              rows: [
                ["<strong>Basic Interaction Comment</strong>", "Post comments directly on target posts; supports script library random selection and AI dynamic generation", "Comments appear in the post's top-level comment section"],
                ["<strong>Nested Comment</strong>", "Nested reply under existing comments; ideal for multi-round interaction storylines", "Comments appear in the reply thread of existing comments"]

            },
            { type: "h3", text: "Basic Interaction Comment · Key Parameters" },
            { type: "table", headers: ["Parameter", "Description"],
              rows: [
