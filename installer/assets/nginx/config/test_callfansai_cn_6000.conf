
server {
	listen          6001 ssl;
	server_name     localhost;
	client_max_body_size 15000m;

	ssl_certificate /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;	

	gzip on;
	gzip_min_length  10k;
	gzip_buffers     4 16k;
	gzip_comp_level 9;
	gzip_types     text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json;
	gzip_vary on;
	gzip_disable   "MSIE [1-6]\.";

        
        location ^~ /camera_web/ {
			alias /usr/share/nginx/html/camera/;
			index index.html;

			try_files $uri $uri/ /camora/index.html;

			location ~* \.(js|css|png|jpg|webp)$ {
				expires 365d;
				add_header Cache-Control "public, immutable";
			}

		}

        # 处理非法路径请求（可选，提升用户体验�?        
		location / {
            return 404 "Please access with format: wss://172.25.1.211:5092/[TargetIP]/[Port] (e.g., wss://172.25.1.211:5092/10.50.5.102/9910)";
        }

}
