
server {
	listen          5092 ssl;
	server_name     localhost;
	client_max_body_size 15000m;

	ssl_certificate /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;	

	gzip on;
	gzip_min_length  10k;
	gzip_buffers     4 16k;
	gzip_comp_level 9;
	gzip_types     text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json;
	gzip_vary on;
	gzip_disable   "MSIE [1-6]\.";

        
         location ~ ^/(\d+\.\d+\.\d+\.\d+)/(\d+)$ {

            # 提取路径中的数字（端口号）并赋值给变量
            set $backend_ip $1;
            set $backend_port $2;


            # 安全验证：确保提取的是合法端口号（数字），拒绝非法请�?            
			if ($backend_port !~ ^\d+$) {
                return 400 "Invalid port number";
            }

            # 安全校验2：验证IP段是合法�?-255（补充正则的宽松校验�?            
			if ($backend_ip ~* (\.|^)(25[5-9]|2[6-9][0-9]|[3-9][0-9][0-9]|1[0-9][0-9][0-9])(\.|$)) {
                return 400 "IP segment must be 0-255";
            }

            # 代理到后端的WS服务地址
            proxy_pass http://$backend_ip:$backend_port;
            
            # WebSocket必须的头信息转发（核心）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 基础的代理头配置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时配置（防止WebSocket连接被过早断开�?            
			proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 86400s;  # WebSocket长连接建议设大一点，比如24小时
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # 处理非法路径请求（可选，提升用户体验�?        
		location / {
            return 404 "Please access with format: wss://172.25.1.211:5092/[TargetIP]/[Port] (e.g., wss://172.25.1.211:5092/10.50.5.102/9910)";
        }

}
