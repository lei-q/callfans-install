				}
		}


		location ^~ /platform_admin/ {
			alias /usr/share/nginx/html/platform_admin/;
			index index.html;
			try_files $uri $uri/ /platform/index.html;
		}
		
		location ^~ /user_manual {
			alias /usr/share/nginx/html/user_manual/;
			index index.html;
			try_files $uri $uri/ /user_manual/index.html;
		}

		location ^~ /mobile_web/ {
			alias /usr/share/nginx/html/mobile_web/;
			index index.html;

			try_files $uri $uri/ /mobile_web/index.html;
		
			location ~* \.(js|css|png|jpg|webp)$ {
				expires 365d;
				add_header Cache-Control "public, immutable";
			}
		}


		location ^~ /sso_web/ {
			alias /usr/share/nginx/html/sso_web/;
