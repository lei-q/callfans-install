server {
		
		listen          80;
		listen          443 ssl;
		server_name     _;
		client_max_body_size 15000m;

		ssl_certificate /etc/nginx/cert.pem;
		ssl_certificate_key /etc/nginx/key.pem;	

		gzip on;
		gzip_min_length  10k;
		gzip_buffers     4 16k;
		gzip_comp_level 9;
		gzip_types     text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json;
		gzip_vary on;
		gzip_disable   "MSIE [1-6]\.";



		

	  location /nginx_status {
		  stub_status;
		  allow 127.0.0.1;
		  deny all;
		}	

		
		location ^~ /social_web/ {
			alias /usr/share/nginx/html/social_web/;
			index index.html;

			try_files $uri $uri/ /social_web/index.html;
		
		
			   location ~* \.(js|css|png|jpg|webp)$ {
					expires 365d;
					add_header Cache-Control "public, immutable";

				}
		}
		
		location ^~ /social_web_v2/ {
			alias /usr/share/nginx/html/social_web/;
			index index.html;

			try_files $uri $uri/ /social_web/index.html;
		
		
			   location ~* \.(js|css|png|jpg|webp)$ {
