			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Accept-Language $http_accept_language;
		}


		location ~ ^/(\d+\.\d+\.\d+\.\d+)/(\d+)$ {

			# 提取路径中的数字（端口号）并赋值给变量
			set $backend_ip $1;
			set $backend_port $2;


			# 安全验证：确保提取的是合法端口号（数字），拒绝非法请 ?   
			if ($backend_port !~ ^\d+$) {
				return 400 "Invalid port number";
			}

			# 安全校验2：验证IP段是合法皿（补充正则的宽松校验＿    
			if ($backend_ip ~* (\.|^)(25[5-9]|2[6-9][0-9]|[3-9][0-9][0-9]|1[0-9][0-9][0-9])(\.|$)) {
				return 400 "IP segment must be 0-255";
			}

			# 代理到后端的WS服务地址
			proxy_pass http://$backend_ip:$backend_port;

			# WebSocket必须的头信息转发（核心）
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";

			# 基础的代理头配置
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# 超时配置（防止WebSocket连接被过早断开 ?   
			proxy_connect_timeout 60s;
			proxy_send_timeout 60s;
			proxy_read_timeout 86400s;  # WebSocket长连接建议设大一点，比如24小时
			proxy_buffer_size 128k;
			proxy_buffers 4 256k;
			proxy_busy_buffers_size 256k;
		}
		location ~ ^/(\d+\.\d+\.\d+\.\d+)/(\d+)(/.*)?$ {
			# 提取变量：IP、端口、后续路径（无则为空 ?   
			set $backend_ip $1;
			set $backend_port $2;
			set $backend_path $3;

			# 安全验证1：端口必须是数字
			if ($backend_port !~ ^\d+$) {
				return 400 "Invalid port number";
			}

			# 安全验证2：IP段必须是0-255
			if ($backend_ip ~* (\.|^)(25[5-9]|2[6-9][0-9]|[3-9][0-9][0-9]|1[0-9][0-9][0-9])(\.|$)) {
				return 400 "IP segment must be 0-255";
			}

			# 拼接完整的后端地址（IP+端口+后续路径 ?   
			proxy_pass http://$backend_ip:$backend_port$backend_path;

			# 动态WebSocket升级配置（HTTPS请求自动适配，无Upgrade头则不升级）
			proxy_set_header Upgrade $http_upgrade;
			# proxy_set_header Connection $connection_upgrade;

			# 基础代理头配 ?   
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# 超时配置
			proxy_connect_timeout 60s;
			proxy_send_timeout 60s;
			proxy_read_timeout 86400s;
			proxy_buffer_size 128k;
			proxy_buffers 4 256k;
			proxy_busy_buffers_size 256k;
		}



		location /websocket/ {
			if ($request_uri ~* "^/websocket/(?<ip>[0-9._]+)/(?<port>[0-9]+)/?$") {
			set $backend_url "http://$ip:$port";  
			}  

			if ($backend_url ~ "(.*)_(.*)") {
			set $backend_url $1.$2;
			}
			if ($backend_url ~ "(.*)_(.*)") {
			set $backend_url $1.$2;
			}
			if ($backend_ip ~ "(.*)_(.*)") {
				set $backend_url $1.$2;
			}
			if ($backend_url ~ "(.*)_(.*)") {
				set $backend_ip $1.$2;
			}
			proxy_pass $backend_ip;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
		}

	

	}
